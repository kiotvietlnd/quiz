<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>    <link rel="icon" type="image/png" href="https://cdn-kvweb.kiotviet.vn/kiotviet-website/wp-content/uploads/2023/10/31095822/64x64.png" sizes="64x64">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard GV - Kế Toán 01</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; font-size: 14px; -webkit-tap-highlight-color: transparent; color: #334155; background-color: #cbd5e1; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        
        .tech-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -10; background: #cbd5e1; overflow: hidden; pointer-events: none; }
        .glow-blob-1, .glow-blob-2 { position: absolute; width: 50vw; height: 50vw; filter: blur(140px); border-radius: 50%; transition: background 1.5s ease-in-out; }
        .glow-blob-1 { top: -15%; left: -10%; background: rgba(37, 99, 235, 0.05); } 
        .glow-blob-2 { bottom: -15%; right: -10%; background: rgba(16, 185, 129, 0.05); }

        /* Ultra Glassmorphism Panel (Nền sáng) */
        .glass-panel-ultra { 
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0.92)); 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px); 
            border: 1px solid rgba(226, 232, 240, 0.8); 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.03), inset 0 1px 0 rgba(255, 255, 255, 1); 
        }
        
        .student-item { transition: all 0.2s; cursor: pointer; }
        .student-active { background-color: #2563eb !important; border-left: 4px solid #f59e0b !important; color: #ffffff !important; }
        .student-active h3 { color: #ffffff !important; }
        .student-active p { color: #bfdbfe !important; }
        .student-active span { background-color: rgba(255,255,255,0.2) !important; color: #ffffff !important; border-color: rgba(255,255,255,0.1) !important; }
        
        .random-spin { animation: highlight-pulse 0.1s infinite alternate; }
        @keyframes highlight-pulse { from { background-color: transparent; } to { background-color: rgba(59, 130, 246, 0.2); } }

        .toast-enter { transform: translateX(120%); opacity: 0; }
        .toast-visible { transform: translateX(0); opacity: 1; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        /* Hiệu ứng Zoom ảnh Giảng viên */
        .zoom-active { max-height: none !important; cursor: zoom-out !important; }
        
        #selTaskFilter option { background-color: #122543; color: #ffffff; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden selection:bg-blue-200">

    <div class="tech-bg"><div class="glow-blob-1" id="blob-1"></div><div class="glow-blob-2" id="blob-2"></div></div>

    <!-- POP-UP THÔNG BÁO REAL-TIME -->
    <div id="toastNotification" class="fixed top-20 right-6 z-[100] bg-white border border-slate-100 shadow-xl rounded-2xl p-4 flex items-start gap-3.5 w-80 toast-enter">
        <div class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center shrink-0 mt-0.5"><i class="fas fa-bell"></i></div>
        <div class="flex-1">
            <h4 class="text-xs font-bold text-slate-800" id="toastName">--</h4>
            <p class="text-[11px] text-slate-500 font-semibold leading-relaxed mt-1" id="toastDesc">--</p>
        </div>
        <button onclick="closeToast()" class="text-slate-400 hover:text-slate-600 transition-colors p-1"><i class="fas fa-times text-xs"></i></button>
    </div>

    <!-- TOP HEADER -->
    <header class="h-16 bg-[#1b365d] border-b border-[#122543] px-6 py-4 flex items-center justify-between shadow-md shrink-0 w-full z-50 sticky top-0">
        <div class="flex items-center gap-3">
            <img src="https://logo.kiotviet.vn/KiotViet-Logo-Horizontal-White.svg" class="h-8" alt="KiotViet Logo">
            <div class="h-5 w-px bg-blue-900/60 mx-1"></div>
            <span class="font-bold text-slate-300 text-xs uppercase tracking-wider"><i class="fas fa-chalkboard-teacher text-blue-400 mr-1.5"></i> PORTAL GIẢNG VIÊN</span>
        </div>
        
        <!-- THANH CÔNG CỤ -->
        <div class="flex items-center gap-3">
            <div class="relative hidden md:flex items-center bg-[#122543]/60 rounded-xl border border-blue-900/40 p-1">
                <span class="text-[10px] font-bold text-blue-300 pl-3 pr-2 uppercase"><i class="fas fa-filter"></i> Lọc Bài:</span>
                <select id="selTaskFilter" onchange="filterStudents()" class="bg-transparent text-xs font-bold text-white focus:outline-none cursor-pointer pr-6 appearance-none">
                    <option value="ALL">Hiển thị Tất cả</option>
                </select>
                <i class="fas fa-chevron-down text-blue-400 text-[9px] absolute right-3 pointer-events-none"></i>
            </div>

            <button onclick="pickRandomStudent()" class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md transition-all flex items-center gap-2 transform active:scale-95">
                <i class="fas fa-dice"></i> Random
            </button>
            <button onclick="manualFetch()" class="w-9 h-9 bg-blue-900/30 hover:bg-blue-900/50 text-blue-300 border border-blue-900/40 rounded-xl flex items-center justify-center transition-all" title="Làm mới">
                <i class="fas fa-sync-alt text-xs" id="syncIcon"></i>
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative z-20">
        <!-- SIDEBAR TRÁI (MÀU NỀN #224472 CHỨA CÁC KHỐI DANH MỤC SÁNG NHẠT, CHỮ ĐEN) -->
        <aside class="w-[300px] bg-[#224472] border-r border-[#173052] flex flex-col shrink-0">
            <div class="p-5 border-b border-white/10 shrink-0">
                <div class="relative">
                    <i class="fas fa-search absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
                    <input type="text" id="inpSearch" onkeyup="filterStudents()" class="w-full text-xs pl-9 pr-4 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 bg-white text-slate-800 font-bold shadow-inner" placeholder="Tìm tên hoặc phòng ban...">
                </div>
                <div class="flex justify-between items-center mt-3.5 px-1">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest" id="lblCount">0 Học viên</span>
                    <span id="syncStatusBadge" class="text-[10px] text-emerald-400 font-bold flex items-center gap-1.5"><i class="fas fa-satellite-dish animate-pulse"></i> Live Sync</span>
                </div>
            </div>
            
            <div id="studentList" class="flex-1 overflow-y-auto custom-scrollbar flex flex-col p-3 space-y-2">
                <div class="p-8 text-center text-slate-400 text-xs font-bold"><i class="fas fa-circle-notch fa-spin text-lg mb-2 text-blue-400"></i><br>Đang đồng bộ dữ liệu...</div>
            </div>
        </aside>

        <!-- MAIN PHẢI (NỀN TRẮNG ĐỤC TRONG SUỐT PHÁT SÁNG) -->
        <main class="flex-1 overflow-y-auto p-6 md:p-8 relative custom-scrollbar bg-slate-200/80 backdrop-blur-[2px]">
            <div id="mainContent" class="max-w-4xl mx-auto h-full flex flex-col items-center justify-center">
                <div class="w-20 h-20 rounded-2xl bg-white/80 border border-slate-100 flex items-center justify-center mb-5 shadow-sm">
                    <i class="fas fa-tv text-3xl text-blue-500"></i>
                </div>
                <h2 class="text-base font-extrabold text-slate-800 tracking-tight text-center uppercase">Chế Độ Chấm Bài Tốc Độ</h2>
                <p class="text-slate-400 text-xs mt-2 text-center font-bold uppercase tracking-wider">Bấm vào tên học viên hoặc dùng nút <strong class="text-orange-500">Random</strong> để kiểm tra.</p>
            </div>
        </main>
    </div>

    <!-- MODAL XEM ẢNH -->
    <div id="imgModal" class="fixed inset-0 bg-slate-900/95 backdrop-blur-sm z-[150] hidden flex-col overflow-auto p-4 items-center justify-center">
        <button onclick="document.getElementById('imgModal').classList.add('hidden')" class="fixed top-4 right-6 w-10 h-10 bg-white/10 hover:bg-red-500 text-white rounded-full flex items-center justify-center text-xl transition z-50"><i class="fas fa-times"></i></button>
        <p class="fixed top-4 left-6 text-white/50 text-sm font-bold bg-black/40 px-3 py-1 rounded-lg z-50 pointer-events-none"><i class="fas fa-search-plus"></i> Bấm vào ảnh để phóng to/thu nhỏ</p>
        <img id="fullImg" src="" onclick="toggleZoom(this)" class="max-w-full max-h-[90vh] object-contain rounded shadow-2xl transition-all duration-300 cursor-zoom-in m-auto mt-16 mb-16 border border-white/10">
    </div>

    <script>
        // ============== CẤU HÌNH API ==============
        const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyW79Xpr_j-R_2fEExc_lJggwDUxKQoXas76qoPoRaVsA2VfaZ1yxXCvAZP3hq862bF/exec"; 
        // ==========================================

        let globalDataString = "{}"; 
        let globalData = {}; 
        let uniqueTasks = new Set();
        let activeStudentName = null; 
        let isFetching = false; 
        let activeSlides = {}; // Quản lý slide ảnh cho từng nhiệm vụ của học viên

        document.addEventListener('DOMContentLoaded', () => { 
            silentFetch(true); 
            setInterval(() => { if(!isFetching) silentFetch(false); }, 10000);
        });

        async function silentFetch(isFirstLoad) {
            if(APP_SCRIPT_URL.includes("AKfycby9-k7Z") && isFirstLoad) return alert("LỖI: Chưa cập nhật APP_SCRIPT_URL!");
            
            isFetching = true;
            if(document.getElementById('syncIcon')) document.getElementById('syncIcon').classList.add('fa-spin');
            
            const listContainer = document.getElementById('studentList');
            if(isFirstLoad) {
                listContainer.innerHTML = '<div class="p-8 text-center text-slate-400 text-xs font-bold"><i class="fas fa-circle-notch fa-spin text-lg mb-2 text-blue-400"></i><br>Đang tải dữ liệu gốc...</div>';
            }

            try {
                let r = await fetch(APP_SCRIPT_URL);
                if (!r.ok) throw new Error("Mất kết nối Server");
                let res = await r.json();

                if(res.status === 'success') {
                    let newString = JSON.stringify(res.data);
                    if(newString !== globalDataString) {
                        if(!isFirstLoad) findAndShowNewTasks(globalData, res.data); 
                        
                        globalDataString = newString;
                        globalData = res.data;
                        extractUniqueTasks();
                        renderSidebar();
                        
                        if(activeStudentName && globalData[activeStudentName]) viewStudent(activeStudentName);
                    }
                } else {
                    listContainer.innerHTML = `<div class="p-6 text-center text-red-500 bg-red-50 rounded-xl text-xs font-bold border border-red-200 m-2">Lỗi GAS: ${res.message}</div>`;
                }
            } catch (err) {
                console.log("Lỗi Fetch:", err);
                if(isFirstLoad) {
                    listContainer.innerHTML = `<div class="p-6 text-center text-red-500 bg-red-50 rounded-xl text-xs font-bold border border-red-200 m-2">Lỗi kết nối!<br>Vui lòng kiểm tra lại.</div>`;
                }
                document.getElementById('syncStatusBadge').innerHTML = `<i class="fas fa-wifi text-red-500"></i> Offline`;
            } finally {
                isFetching = false;
                if(document.getElementById('syncIcon')) document.getElementById('syncIcon').classList.remove('fa-spin');
                if(!document.getElementById('syncStatusBadge').innerHTML.includes('Offline')) {
                    document.getElementById('syncStatusBadge').innerHTML = `<i class="fas fa-satellite-dish animate-pulse"></i> Live Sync`;
                }
            }
        }

        function manualFetch() { silentFetch(false); }

        function findAndShowNewTasks(oldData, newData) {
            let latestStudent = null; let latestTaskName = null;
            for(let studentName in newData) {
                const newTasks = newData[studentName].tasks;
                const oldTasks = oldData[studentName] ? oldData[studentName].tasks : {};
                for(let taskName in newTasks) {
                    if(!oldTasks[taskName] || newTasks[taskName].time !== oldTasks[taskName].time) {
                        latestStudent = studentName; latestTaskName = taskName.split(':')[0]; 
                    }
                }
            }
            if(latestStudent) showToast(latestStudent, latestTaskName); 
        }

        let toastTimeout;
        function showToast(name, taskDesc) {
            const toast = document.getElementById('toastNotification');
            document.getElementById('toastName').innerText = name;
            document.getElementById('toastDesc').innerText = `Vừa nộp lại kết quả: ${taskDesc}`;
            toast.classList.remove('toast-enter'); toast.classList.add('toast-visible');
            clearTimeout(toastTimeout); toastTimeout = setTimeout(() => { closeToast(); }, 6000);
        }

        function closeToast() {
            const toast = document.getElementById('toastNotification');
            toast.classList.remove('toast-visible'); toast.classList.add('toast-enter');
        }

        function extractUniqueTasks() {
            uniqueTasks.clear();
            Object.values(globalData).forEach(student => {
                Object.keys(student.tasks).forEach(taskName => uniqueTasks.add(taskName));
            });
            const sel = document.getElementById('selTaskFilter');
            let currentVal = sel.value;
            let html = '<option value="ALL">Hiển thị Tất cả</option>';
            Array.from(uniqueTasks).sort().forEach(t => html += `<option value="${t}">${t.split(': ')[0]}</option>`);
            sel.innerHTML = html;
            if(Array.from(uniqueTasks).includes(currentVal)) sel.value = currentVal;
        }

        function renderSidebar() {
            const listContainer = document.getElementById('studentList');
            const searchKeyword = document.getElementById('inpSearch').value.toLowerCase();
            const taskFilter = document.getElementById('selTaskFilter').value;
            
            let html = ''; let count = 0;
            const studentNames = Object.keys(globalData).sort();
            
            studentNames.forEach(name => {
                const student = globalData[name];
                let matchSearch = name.toLowerCase().includes(searchKeyword) || student.dept.toLowerCase().includes(searchKeyword);
                let matchTask = taskFilter === 'ALL' ? true : !!student.tasks[taskFilter];
                
                if(matchSearch && matchTask) {
                    count++;
                    const taskCount = Object.keys(student.tasks).length;
                    const isActive = (name === activeStudentName) ? 'student-active' : '';
                    const badgeColor = isActive 
                        ? `bg-white/20 text-white border-white/10` 
                        : `bg-slate-100 text-slate-500 border-slate-200`;

                    const statusBadge = taskFilter !== 'ALL' 
                        ? `<span class="text-emerald-500 text-[10px] font-bold"><i class="fas fa-check-circle"></i> Xong</span>`
                        : `<span class="${badgeColor} text-[10px] font-bold px-1.5 py-0.5 rounded border">${taskCount} Bài</span>`;

                    html += `
                        <div class="student-item bg-white/90 hover:bg-white rounded-xl p-3 shadow-sm border border-slate-200 flex flex-col gap-1 transition-all duration-200 text-slate-800 ${isActive}" data-name="${name}" onclick="viewStudent('${name}')">
                            <div class="flex justify-between items-start">
                                <h3 class="font-bold text-[13px] truncate pr-2 text-slate-800">${name}</h3>
                                ${statusBadge}
                            </div>
                            <p class="text-[10px] text-slate-500 font-semibold truncate uppercase tracking-wider">${student.dept}</p>
                        </div>
                    `;
                }
            });
            
            if(count === 0) html = '<div class="p-6 text-center text-slate-400 text-[12px] font-medium mt-2">Không có dữ liệu.</div>';
            listContainer.innerHTML = html;
            document.getElementById('lblCount').innerText = `${count} Học viên`;
        }

        function filterStudents() { renderSidebar(); }

        function pickRandomStudent() {
            const visibleItems = document.querySelectorAll('.student-item');
            if(visibleItems.length === 0) return alert("Không có học viên nào để gọi!");
            
            let iterations = 0; const maxIterations = 15;
            const interval = setInterval(() => {
                visibleItems.forEach(i => i.classList.remove('random-spin', 'bg-blue-50'));
                const randIndex = Math.floor(Math.random() * visibleItems.length);
                const target = visibleItems[randIndex];
                target.classList.add('random-spin', 'bg-blue-50');
                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                
                iterations++;
                if(iterations >= maxIterations) {
                    clearInterval(interval);
                    target.classList.remove('random-spin'); target.click(); 
                }
            }, 100);
        }

        function getDirectImageUrl(url) { 
            let match = url.match(/\/d\/(.+?)\//) || url.match(/id=(.+?)(&|$)/); 
            if(match && match[1]) return `https://lh3.googleusercontent.com/d/${match[1]}`; return url; 
        }

        // Hàm xử lý chuyển Slide điều hướng cho bài tập nộp nhiều ảnh
        function changeSlide(taskKey, dir, total) {
            let current = activeSlides[taskKey] || 0;
            document.getElementById(`${taskKey}-${current}`).classList.add('hidden');
            
            current = (current + dir + total) % total;
            activeSlides[taskKey] = current;
            
            document.getElementById(`${taskKey}-${current}`).classList.remove('hidden');
            document.getElementById(`counter-${taskKey}`).innerText = `${current + 1} / ${total}`;
        }

        function viewStudent(name) {
            activeStudentName = name; 
            document.querySelectorAll('.student-item').forEach(item => item.classList.remove('student-active'));
            const activeEl = Array.from(document.querySelectorAll('.student-item')).find(el => el.getAttribute('data-name') === name);
            if(activeEl) activeEl.classList.add('student-active');

            const student = globalData[name];
            const taskFilter = document.getElementById('selTaskFilter').value;
            const main = document.getElementById('mainContent');
            
            // Xóa cache Slider cũ trước khi kết xuất của học viên mới
            activeSlides = {};

            let html = `
                <div class="glass-panel-ultra p-5 rounded-3xl mb-6 flex justify-between items-center sticky top-0 z-10 shadow-sm border border-slate-100">
                    <div>
                        <h1 class="text-lg font-extrabold text-blue-700 tracking-tight">${student.name}</h1>
                        <p class="text-[10px] text-slate-400 font-bold mt-0.5 uppercase tracking-wider"><i class="fas fa-briefcase text-slate-300 mr-1"></i> ${student.dept}</p>
                    </div>
                </div>
                <div class="w-full space-y-4 pb-20">
            `;

            for(let taskName in student.tasks) {
                if(taskFilter !== 'ALL' && taskName !== taskFilter) continue; 
                
                const task = student.tasks[taskName];
                let imgHtml = '';
                
                let validImages = (task.images || []).filter(url => url && url.trim() !== '');

                if(validImages.length > 0) {
                    let taskKey = 'slide_' + name.replace(/[^a-zA-Z0-9]/g, '') + '_' + taskName.replace(/[^a-zA-Z0-9]/g, '');
                    
                    if (validImages.length === 1) {
                        const directUrl = getDirectImageUrl(validImages[0]);
                        imgHtml = `
                            <div class="relative w-full h-96 bg-slate-100 rounded-xl overflow-hidden border border-slate-200 mt-3 cursor-zoom-in" onclick="openImage('${directUrl}')">
                                <img src="${directUrl}" class="w-full h-full object-contain hover:scale-[1.01] transition-transform duration-300">
                            </div>
                        `;
                    } else {
                        activeSlides[taskKey] = 0;
                        
                        let slidesImages = validImages.map((url, i) => {
                            let hiddenClass = i === 0 ? "" : "hidden";
                            const directUrl = getDirectImageUrl(url);
                            return `<img id="${taskKey}-${i}" src="${directUrl}" class="absolute inset-0 w-full h-full object-contain cursor-zoom-in transition-opacity duration-300 ${hiddenClass}" onclick="openImage('${directUrl}')">`;
                        }).join('');
                        
                        imgHtml = `
                            <div class="relative w-full h-96 bg-slate-100 rounded-xl overflow-hidden border border-slate-200 mt-3">
                                ${slidesImages}
                                <button type="button" onclick="changeSlide('${taskKey}', -1, ${validImages.length})" class="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/50 hover:bg-black/75 text-white flex items-center justify-center transition-all z-10"><i class="fas fa-chevron-left text-sm"></i></button>
                                <button type="button" onclick="changeSlide('${taskKey}', 1, ${validImages.length})" class="absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/50 hover:bg-black/75 text-white flex items-center justify-center transition-all z-10"><i class="fas fa-chevron-right text-sm"></i></button>
                                <span id="counter-${taskKey}" class="absolute bottom-3 right-3 bg-black/60 text-white text-[10px] px-2.5 py-1 rounded font-bold">1 / ${validImages.length}</span>
                            </div>
                        `;
                    }
                } else {
                    imgHtml = `
                        <div class="bg-rose-50/50 border border-rose-100 border-dashed rounded-2xl p-6 h-full flex flex-col items-center justify-center text-center text-rose-500 mt-3">
                            <i class="fas fa-exclamation-triangle text-xl mb-2"></i>
                            <span class="text-xs font-semibold">Không đính kèm minh chứng hình ảnh</span>
                        </div>
                    `;
                }

                html += `
                    <div class="glass-panel-ultra p-6 rounded-3xl shadow-sm border border-slate-100">
                        <div class="flex justify-between items-start mb-4 border-b border-slate-100 pb-3">
                            <h3 class="font-extrabold text-slate-800 text-[14px] border-l-4 border-blue-500 pl-2.5 leading-tight">${taskName}</h3>
                            <span class="text-[10px] text-slate-400 font-bold bg-slate-50 px-2.5 py-1 rounded-lg border border-slate-200/50"><i class="far fa-clock"></i> Nộp: ${task.time.split(' ')[1]}</span>
                        </div>
                        ${imgHtml}
                    </div>
                `;
            }

            html += `</div>`;
            main.className = "max-w-4xl mx-auto h-full flex flex-col justify-start";
            main.innerHTML = html;
        }

        function openImage(url) {
            document.getElementById('fullImg').src = url;
            document.getElementById('fullImg').classList.remove('zoom-active'); // Đặt lại trạng thái zoom
            document.getElementById('imgModal').classList.remove('hidden');
            document.getElementById('imgModal').classList.add('flex');
        }

        function toggleZoom(imgEl) {
            imgEl.classList.toggle('zoom-active');
        }
    </script>
</body>
</html>
