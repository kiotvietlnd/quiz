<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard GV - Kế Toán 01</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #334155; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        
        .tech-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -10; background: #f8fafc; overflow: hidden; pointer-events: none; }
        .glow-blob-1 { position: absolute; top: -20%; left: -10%; width: 60vw; height: 60vw; filter: blur(120px); border-radius: 50%; animation: float 20s ease-in-out infinite; background: rgba(59, 130, 246, 0.08); }
        .glow-blob-2 { position: absolute; bottom: -20%; right: -10%; width: 50vw; height: 50vw; filter: blur(100px); border-radius: 50%; animation: float 15s ease-in-out infinite reverse; background: rgba(139, 92, 246, 0.08); }
        @keyframes float { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(40px) scale(1.05); } }

        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 4px 20px -5px rgba(0,0,0,0.05); }
        .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.8); }
        
        .student-item { transition: all 0.2s; cursor: pointer; border-left: 3px solid transparent; }
        .student-active { background-color: #f0f9ff; border-left: 3px solid #3b82f6; }
        
        .random-spin { animation: highlight-pulse 0.1s infinite alternate; }
        @keyframes highlight-pulse { from { background-color: transparent; } to { background-color: #dbeafe; border-left-color: #60a5fa; } }

        .toast-enter { transform: translateX(120%); opacity: 0; }
        .toast-visible { transform: translateX(0); opacity: 1; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        /* Hiệu ứng Zoom ảnh Giảng viên */
        .zoom-active { max-height: none !important; cursor: zoom-out !important; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden selection:bg-blue-200">

    <div class="tech-bg"><div class="glow-blob-1"></div><div class="glow-blob-2"></div></div>

    <!-- POP-UP THÔNG BÁO REAL-TIME -->
    <div id="toastNotification" class="fixed top-20 right-6 z-50 bg-white border border-blue-200 shadow-xl rounded-xl p-4 flex items-start gap-3 w-80 toast-enter">
        <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center shrink-0 mt-0.5"><i class="fas fa-bell"></i></div>
        <div class="flex-1">
            <h4 class="text-sm font-bold text-slate-800" id="toastName">--</h4>
            <p class="text-[12px] text-slate-500 font-medium leading-snug mt-0.5" id="toastDesc">--</p>
        </div>
        <button onclick="closeToast()" class="text-slate-400 hover:text-slate-600 focus:outline-none"><i class="fas fa-times"></i></button>
    </div>

    <!-- TOP HEADER -->
    <header class="glass-header h-14 flex items-center justify-between px-6 z-30 shrink-0 relative">
        <div class="flex items-center gap-3">
            <img src="https://logo.kiotviet.vn/KiotViet-Logo-Horizontal.svg" class="h-6">
            <div class="h-4 w-px bg-slate-300 mx-1"></div>
            <span class="font-bold text-slate-700 text-sm tracking-tight"><i class="fas fa-chalkboard-teacher text-blue-500 mr-1.5"></i> PORTAL GIẢNG VIÊN</span>
        </div>
        
        <!-- THANH CÔNG CỤ -->
        <div class="flex items-center gap-3">
            <div class="relative hidden md:flex items-center bg-slate-100 rounded-md border border-slate-200 p-1">
                <span class="text-[11px] font-bold text-slate-500 pl-3 pr-2 uppercase"><i class="fas fa-filter"></i> Lọc Bài:</span>
                <select id="selTaskFilter" onchange="filterStudents()" class="bg-transparent text-[13px] font-bold text-blue-700 focus:outline-none cursor-pointer pr-4 appearance-none">
                    <option value="ALL">Hiển thị Tất cả</option>
                </select>
                <i class="fas fa-chevron-down text-blue-500 text-[9px] absolute right-3 pointer-events-none"></i>
            </div>

            <button onclick="pickRandomStudent()" class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-1.5 rounded-md text-[13px] font-bold shadow-sm transition flex items-center gap-2 transform active:scale-95">
                <i class="fas fa-dice"></i> Random
            </button>
            <button onclick="manualFetch()" class="w-8 h-8 bg-blue-50 hover:bg-blue-100 text-blue-600 border border-blue-200 rounded-md flex items-center justify-center transition" title="Làm mới">
                <i class="fas fa-sync-alt text-sm" id="syncIcon"></i>
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative z-20">
        <!-- SIDEBAR TRÁI -->
        <aside class="w-[300px] glass-panel border-r-0 border-r border-slate-200/50 flex flex-col shrink-0">
            <div class="p-4 border-b border-slate-200/60 shrink-0">
                <div class="relative">
                    <i class="fas fa-search absolute left-3 top-2.5 text-slate-400 text-sm"></i>
                    <input type="text" id="inpSearch" onkeyup="filterStudents()" class="w-full bg-slate-50 border border-slate-200 rounded-lg pl-9 pr-3 py-2 text-[13px] font-medium focus:outline-none focus:border-blue-400 focus:bg-white transition" placeholder="Tìm tên hoặc phòng ban...">
                </div>
                <div class="flex justify-between items-center mt-3 px-1">
                    <span class="text-[11px] font-bold text-slate-400 uppercase tracking-widest" id="lblCount">0 Học viên</span>
                    <span id="syncStatusBadge" class="text-[10px] text-emerald-500 font-semibold"><i class="fas fa-satellite-dish animate-pulse"></i> Live Sync</span>
                </div>
            </div>
            
            <div id="studentList" class="flex-1 overflow-y-auto custom-scrollbar flex flex-col p-2 space-y-1">
                <div class="p-8 text-center text-slate-400 text-sm font-medium"><i class="fas fa-circle-notch fa-spin text-xl mb-2 text-blue-400"></i><br>Đang đồng bộ dữ liệu...</div>
            </div>
        </aside>

        <!-- MAIN PHẢI -->
        <main class="flex-1 overflow-y-auto p-6 md:p-8 relative custom-scrollbar bg-white/40">
            <div id="mainContent" class="max-w-4xl mx-auto h-full flex flex-col items-center justify-center">
                <div class="w-20 h-20 rounded-full bg-blue-50 flex items-center justify-center mb-5 shadow-inner border border-blue-100">
                    <i class="fas fa-tv text-3xl text-blue-300"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-500 tracking-tight text-center">Chế Độ Chấm Bài Tốc Độ</h2>
                <p class="text-slate-400 text-[13px] mt-2 text-center font-medium">Bấm vào tên học viên hoặc dùng nút <strong class="text-orange-500">Random</strong> để kiểm tra.</p>
            </div>
        </main>
    </div>

    <!-- MODAL XEM ẢNH -->
    <div id="imgModal" class="fixed inset-0 bg-slate-900/95 backdrop-blur-sm z-[150] hidden flex-col overflow-auto p-4 items-center justify-center">
        <button onclick="document.getElementById('imgModal').classList.add('hidden')" class="fixed top-4 right-6 w-10 h-10 bg-white/10 hover:bg-red-500 text-white rounded-full flex items-center justify-center text-xl transition z-50"><i class="fas fa-times"></i></button>
        <p class="fixed top-4 left-6 text-white/50 text-sm font-bold bg-black/40 px-3 py-1 rounded-lg z-50 pointer-events-none"><i class="fas fa-search-plus"></i> Bấm vào ảnh để phóng to/thu nhỏ</p>
        <img id="fullImg" src="" onclick="toggleZoom(this)" class="max-w-full max-h-[90vh] object-contain rounded shadow-2xl transition-all duration-300 cursor-zoom-in m-auto mt-16 mb-16 border border-white/10">
    </div>

    <script>
        // ============== CẤU HÌNH API ==============
        const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyW79Xpr_j-R_2fEExc_lJggwDUxKQoXas76qoPoRaVsA2VfaZ1yxXCvAZP3hq862bF/exec"; 
        // ==========================================

        let globalDataString = "{}"; 
        let globalData = {}; 
        let uniqueTasks = new Set();
        let activeStudentName = null; 
        let isFetching = false; 

        document.addEventListener('DOMContentLoaded', () => { 
            silentFetch(true); 
            setInterval(() => { if(!isFetching) silentFetch(false); }, 10000);
        });

        async function silentFetch(isFirstLoad) {
            if(APP_SCRIPT_URL.includes("AKfycby9-k7Z") && isFirstLoad) return alert("LỖI: Chưa cập nhật APP_SCRIPT_URL!");
            
            isFetching = true;
            if(document.getElementById('syncIcon')) document.getElementById('syncIcon').classList.add('fa-spin');
            
            const listContainer = document.getElementById('studentList');
            if(isFirstLoad) {
                listContainer.innerHTML = '<div class="p-8 text-center text-slate-400 text-[13px] font-medium"><i class="fas fa-circle-notch fa-spin text-xl mb-2 text-blue-400"></i><br>Đang tải dữ liệu gốc...</div>';
            }

            try {
                let r = await fetch(APP_SCRIPT_URL);
                if (!r.ok) throw new Error("Mất kết nối Server");
                let res = await r.json();

                if(res.status === 'success') {
                    let newString = JSON.stringify(res.data);
                    if(newString !== globalDataString) {
                        if(!isFirstLoad) findAndShowNewTasks(globalData, res.data); 
                        
                        globalDataString = newString;
                        globalData = res.data;
                        extractUniqueTasks();
                        renderSidebar();
                        
                        if(activeStudentName && globalData[activeStudentName]) viewStudent(activeStudentName);
                    }
                } else {
                    listContainer.innerHTML = `<div class="p-6 text-center text-red-500 bg-red-50 rounded-xl text-[13px] font-bold border border-red-200 m-2">Lỗi GAS: ${res.message}</div>`;
                }
            } catch (err) {
                console.log("Lỗi Fetch:", err);
                if(isFirstLoad) {
                    listContainer.innerHTML = `<div class="p-6 text-center text-red-500 bg-red-50 rounded-xl text-[13px] font-bold border border-red-200 m-2">Lỗi kết nối!<br>Vui lòng kiểm tra lại.</div>`;
                }
                document.getElementById('syncStatusBadge').innerHTML = `<i class="fas fa-wifi text-red-500"></i> Offline`;
            } finally {
                isFetching = false;
                if(document.getElementById('syncIcon')) document.getElementById('syncIcon').classList.remove('fa-spin');
                if(!document.getElementById('syncStatusBadge').innerHTML.includes('Offline')) {
                    document.getElementById('syncStatusBadge').innerHTML = `<i class="fas fa-satellite-dish animate-pulse"></i> Live Sync`;
                }
            }
        }

        function manualFetch() { silentFetch(false); }

        function findAndShowNewTasks(oldData, newData) {
            let latestStudent = null; let latestTaskName = null;
            for(let studentName in newData) {
                const newTasks = newData[studentName].tasks;
                const oldTasks = oldData[studentName] ? oldData[studentName].tasks : {};
                for(let taskName in newTasks) {
                    if(!oldTasks[taskName] || newTasks[taskName].time !== oldTasks[taskName].time) {
                        latestStudent = studentName; latestTaskName = taskName.split(':')[0]; 
                    }
                }
            }
            if(latestStudent) showToast(latestStudent, latestTaskName); 
        }

        let toastTimeout;
        function showToast(name, taskDesc) {
            const toast = document.getElementById('toastNotification');
            document.getElementById('toastName').innerText = name;
            document.getElementById('toastDesc').innerText = `Vừa nộp lại kết quả: ${taskDesc}`;
            toast.classList.remove('toast-enter'); toast.classList.add('toast-visible');
            clearTimeout(toastTimeout); toastTimeout = setTimeout(() => { closeToast(); }, 6000);
        }

        function closeToast() {
            const toast = document.getElementById('toastNotification');
            toast.classList.remove('toast-visible'); toast.classList.add('toast-enter');
        }

        function extractUniqueTasks() {
            uniqueTasks.clear();
            Object.values(globalData).forEach(student => {
                Object.keys(student.tasks).forEach(taskName => uniqueTasks.add(taskName));
            });
            const sel = document.getElementById('selTaskFilter');
            let currentVal = sel.value;
            let html = '<option value="ALL">Hiển thị Tất cả</option>';
            Array.from(uniqueTasks).sort().forEach(t => html += `<option value="${t}">${t.split(': ')[0]}</option>`);
            sel.innerHTML = html;
            if(Array.from(uniqueTasks).includes(currentVal)) sel.value = currentVal;
        }

        function renderSidebar() {
            const listContainer = document.getElementById('studentList');
            const searchKeyword = document.getElementById('inpSearch').value.toLowerCase();
            const taskFilter = document.getElementById('selTaskFilter').value;
            
            let html = ''; let count = 0;
            const studentNames = Object.keys(globalData).sort();
            
            studentNames.forEach(name => {
                const student = globalData[name];
                let matchSearch = name.toLowerCase().includes(searchKeyword) || student.dept.toLowerCase().includes(searchKeyword);
                let matchTask = taskFilter === 'ALL' ? true : !!student.tasks[taskFilter];
                
                if(matchSearch && matchTask) {
                    count++;
                    const taskCount = Object.keys(student.tasks).length;
                    const statusBadge = taskFilter !== 'ALL' 
                        ? `<span class="text-emerald-500 text-[10px] font-bold"><i class="fas fa-check-circle"></i> Xong</span>`
                        : `<span class="bg-slate-100 text-slate-500 text-[10px] font-bold px-1.5 py-0.5 rounded border border-slate-200">${taskCount} Bài</span>`;
                    const isActive = (name === activeStudentName) ? 'student-active' : '';

                    html += `
                        <div class="student-item bg-white hover:bg-slate-50 rounded-lg p-2.5 shadow-sm border border-slate-100 flex flex-col gap-0.5 ${isActive}" data-name="${name}" onclick="viewStudent('${name}')">
                            <div class="flex justify-between items-start">
                                <h3 class="font-bold text-slate-700 text-[13px] truncate pr-2">${name}</h3>
                                ${statusBadge}
                            </div>
                            <p class="text-[10px] text-slate-400 font-medium truncate">${student.dept}</p>
                        </div>
                    `;
                }
            });
            
            if(count === 0) html = '<div class="p-6 text-center text-slate-400 text-[12px] font-medium mt-2">Không có dữ liệu.</div>';
            listContainer.innerHTML = html;
            document.getElementById('lblCount').innerText = `${count} Học viên`;
        }

        function filterStudents() { renderSidebar(); }

        function pickRandomStudent() {
            const visibleItems = document.querySelectorAll('.student-item');
            if(visibleItems.length === 0) return alert("Không có học viên nào để gọi!");
            
            let iterations = 0; const maxIterations = 15;
            const interval = setInterval(() => {
                visibleItems.forEach(i => i.classList.remove('random-spin', 'bg-blue-50'));
                const randIndex = Math.floor(Math.random() * visibleItems.length);
                const target = visibleItems[randIndex];
                target.classList.add('random-spin', 'bg-blue-50');
                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                
                iterations++;
                if(iterations >= maxIterations) {
                    clearInterval(interval);
                    target.classList.remove('random-spin'); target.click(); 
                }
            }, 100);
        }

        function getDirectImageUrl(url) { 
            let match = url.match(/\/d\/(.+?)\//) || url.match(/id=(.+?)(&|$)/); 
            if(match && match[1]) return `https://lh3.googleusercontent.com/d/${match[1]}`; return url; 
        }

        function viewStudent(name) {
            activeStudentName = name; 
            document.querySelectorAll('.student-item').forEach(item => item.classList.remove('student-active'));
            const activeEl = Array.from(document.querySelectorAll('.student-item')).find(el => el.getAttribute('data-name') === name);
            if(activeEl) activeEl.classList.add('student-active');

            const student = globalData[name];
            const taskFilter = document.getElementById('selTaskFilter').value;
            const main = document.getElementById('mainContent');
            
            let html = `
                <div class="glass-panel p-5 rounded-xl mb-6 flex justify-between items-center sticky top-0 z-10 shadow-sm border-slate-200">
                    <div>
                        <h1 class="text-xl font-bold text-blue-700 tracking-tight">${student.name}</h1>
                        <p class="text-[11px] text-slate-500 font-medium mt-0.5 uppercase tracking-wider"><i class="fas fa-briefcase text-slate-300"></i> ${student.dept}</p>
                    </div>
                </div>
                <div class="w-full space-y-4 pb-20">
            `;

            for(let taskName in student.tasks) {
                if(taskFilter !== 'ALL' && taskName !== taskFilter) continue; 
                
                const task = student.tasks[taskName];
                let imgHtml = '';
                if(task.images && task.images.length > 0) {
                    imgHtml = `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 mt-3">`;
                    task.images.forEach(url => {
                        if(url.trim() === '') return;
                        const directUrl = getDirectImageUrl(url);
                        imgHtml += `
                            <div onclick="openImage('${directUrl}')" class="relative group cursor-zoom-in aspect-video bg-slate-50 rounded-lg overflow-hidden border border-slate-200 hover:border-blue-400 transition-colors">
                                <img src="${directUrl}" class="w-full h-full object-cover">
                                <div class="absolute inset-0 bg-blue-900/30 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                    <i class="fas fa-expand text-white text-2xl drop-shadow-md"></i>
                                </div>
                            </div>
                        `;
                    });
                    imgHtml += `</div>`;
                }

                html += `
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                        <div class="flex justify-between items-start mb-2 border-b border-slate-50 pb-2">
                            <h3 class="font-bold text-slate-700 text-[15px] border-l-4 border-blue-500 pl-2 leading-tight">${taskName}</h3>
                            <span class="text-[10px] text-slate-400 font-medium bg-slate-50 px-2 py-1 rounded-md"><i class="far fa-clock"></i> Nộp: ${task.time.split(' ')[1]}</span>
                        </div>
                        ${imgHtml}
                    </div>
                `;
            }

            html += `</div>`;
            main.className = "max-w-4xl mx-auto h-full flex flex-col justify-start";
            main.innerHTML = html;
        }

        function openImage(url) {
            document.getElementById('fullImg').src = url;
            document.getElementById('fullImg').classList.remove('zoom-active'); // Đặt lại zoom
            document.getElementById('imgModal').classList.remove('hidden');
            document.getElementById('imgModal').classList.add('flex');
        }

        function toggleZoom(imgEl) {
            imgEl.classList.toggle('zoom-active');
        }
    </script>
</body>
</html>
