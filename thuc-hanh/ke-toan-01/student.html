<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học viên - Thực hành Kế Toán 01</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #334155; }
        .glass-header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #e2e8f0; }
        .task-card { transition: all 0.2s ease; border: 2px solid transparent; }
        .task-card:focus-within { border-color: #3b82f6; box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.2); }
    </style>
</head>
<body class="relative min-h-screen">

    <!-- MODAL ĐỊNH DANH -->
    <div id="authModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[100] flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl border border-slate-200">
            <h2 class="text-2xl font-black text-blue-700 mb-2 text-center">ĐIỂM DANH ĐẦU GIỜ</h2>
            <p class="text-sm text-slate-500 mb-6 text-center font-semibold">Khóa học Kế Toán 01 (KiotViet)</p>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-black text-slate-400 uppercase mb-2">Họ và tên của bạn</label>
                    <input type="text" id="inpName" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-3 font-bold focus:outline-none focus:border-blue-500" placeholder="Nguyễn Văn A">
                </div>
                <div>
                    <label class="block text-xs font-black text-slate-400 uppercase mb-2">Phòng ban (Khu vực)</label>
                    <input type="text" id="inpDept" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-3 font-bold focus:outline-none focus:border-blue-500" placeholder="Sales HCM 01">
                </div>
                <button onclick="saveProfile()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3.5 rounded-xl transition shadow-lg mt-4">VÀO LỚP HỌC</button>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header class="glass-header sticky top-0 z-50 h-16 flex items-center justify-between px-4 md:px-8">
        <div class="flex items-center gap-3">
            <img src="https://logo.kiotviet.vn/KiotViet-Logo-Horizontal.svg" class="h-6">
            <div class="h-5 w-px bg-slate-300 mx-2"></div>
            <span class="font-black text-slate-700 hidden md:block">Thực hành Kế Toán 01</span>
        </div>
        <div id="studentInfo" class="flex items-center gap-2 bg-blue-50 text-blue-700 px-4 py-1.5 rounded-full text-sm font-bold border border-blue-200 cursor-pointer shadow-sm hidden" onclick="document.getElementById('authModal').classList.remove('hidden')">
            <i class="fas fa-user-circle"></i> <span id="lblStudentName"></span>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-4xl mx-auto p-4 md:p-8 space-y-8 pb-24" id="taskListContainer">
        <!-- Render bằng Javascript -->
    </main>

    <script>
        // ============== CẤU HÌNH API ==============
        // Thay link Web App của Google Apps Script vào đây sau khi Deploy
        const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvqEWis-OVNgN2HQs3PyVt8RZ0GoGIqjN19KejVUJgCAFT2k2kBdD8cgiOOw88MetH/exec"; 
        // ==========================================

        const TASKS = [
            { id: 1, title: "Nhiệm vụ 1: Khảo sát đầu giờ", desc: "Quét mã QR hoặc nhấn vào nút bên dưới để làm khảo sát đánh giá mức độ tự tin và vướng mắc thực tế.", link: "https://forms.google.com/...", btnText: "Làm Khảo Sát", requireUpload: false },
            { id: 2, title: "Nhiệm vụ 2: Tạo gian hàng & Import hàng hóa", desc: "Sử dụng tài khoản KiotViet tạo gian hàng dùng thử. Thực hiện import danh sách hàng hóa cơ bản.", requireUpload: true },
            { id: 3, title: "Nhiệm vụ 3: Thiết lập Hồ sơ khai thuế (Nhóm 1)", desc: "Cài đặt nhóm thuế cho cửa hàng là Nhóm 1 (Miễn thuế).", requireUpload: true },
            { id: 4, title: "Nhiệm vụ 4: Kiểm tra Sổ kế toán & Tờ khai", desc: "Ra quầy bán 1 đơn hàng bất kỳ. Quay lại kiểm tra Sổ kế toán và Tờ khai thuế của Nhóm 1 xem số liệu đã nhảy chưa.", requireUpload: true },
            { id: 5, title: "Nhiệm vụ 5: Đổi thiết lập sang Nhóm 2", desc: "Vào thiết lập đổi cửa hàng sang Nhóm 2. Xem sự tự động thay đổi mẫu sổ và tờ khai trên hệ thống.", requireUpload: true },
            { id: 6, title: "Nhiệm vụ 6: Setup Hóa đơn điện tử (Bước 1 - 4)", desc: "Thực hiện cài đặt HĐĐT đến bước nộp tờ khai (Bước 4) trên hệ thống.", requireUpload: true },
            { id: 7, title: "Nhiệm vụ 7: Tải Logo & Kết nối HĐĐT (Bước 5 - 6)", desc: "Hoàn thiện tải Logo hóa đơn và điền OTP để kết nối thành công.", requireUpload: true },
            { id: 8, title: "Nhiệm vụ 8: Thực hành trên LND - Phát hành HĐĐT", desc: "Đăng nhập tài khoản LND. Ra quầy thu ngân bán 1 đơn và test nút Phát hành HĐĐT trực tiếp.", requireUpload: true },
            { id: 9, title: "Nhiệm vụ 9: Quản lý cuối ngày & Gửi CQT", desc: "Lọc các hóa đơn Chưa gửi CQT và thao tác gửi hàng loạt.", requireUpload: true },
            { id: 10, title: "Nhiệm vụ 10: Khảo sát cuối khóa học", desc: "Làm khảo sát để đánh giá khóa học và nhận lộ trình thi chứng chỉ.", link: "https://forms.google.com/...", btnText: "Làm Khảo Sát Cuối Khóa", requireUpload: false }
        ];

        let pendingFiles = {}; // { taskId: [file1, file2] }

        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            renderTasks();
            setupGlobalPaste();
        });

        function checkAuth() {
            const profileRaw = localStorage.getItem('kt01_profile');
            if(profileRaw) {
                const profile = JSON.parse(profileRaw);
                document.getElementById('lblStudentName').innerText = profile.name + " - " + profile.dept;
                document.getElementById('studentInfo').classList.remove('hidden');
            } else {
                document.getElementById('authModal').classList.remove('hidden');
            }
        }

        function saveProfile() {
            const name = document.getElementById('inpName').value.trim();
            const dept = document.getElementById('inpDept').value.trim();
            if(!name || !dept) return alert("Vui lòng nhập đủ thông tin!");
            localStorage.setItem('kt01_profile', JSON.stringify({name, dept}));
            document.getElementById('authModal').classList.add('hidden');
            checkAuth();
        }

        function renderTasks() {
            const container = document.getElementById('taskListContainer');
            let html = '';
            TASKS.forEach(t => {
                pendingFiles[t.id] = [];
                let uploadHtml = '';
                if(t.requireUpload) {
                    uploadHtml = `
                        <div class="mt-4 p-4 bg-slate-50 border border-dashed border-slate-300 rounded-xl">
                            <div class="flex items-center gap-4">
                                <label class="bg-white border border-slate-200 text-slate-700 px-4 py-2 text-sm font-bold rounded-lg cursor-pointer hover:bg-slate-100 shadow-sm transition">
                                    <i class="fas fa-image text-blue-500 mr-1"></i> Tải ảnh lên
                                    <input type="file" multiple accept="image/*" class="hidden" onchange="handleFileSelect(event, ${t.id})">
                                </label>
                                <span class="text-xs text-slate-400 font-semibold italic">...hoặc click vào khung này và ấn Ctrl+V để dán ảnh chụp màn hình</span>
                            </div>
                            <div id="tags_${t.id}" class="mt-3 flex flex-wrap gap-2 empty:hidden"></div>
                        </div>
                        <button id="btnSubmit_${t.id}" onclick="submitTask(${t.id}, '${t.title}')" class="mt-4 w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white font-black text-sm px-6 py-2.5 rounded-xl shadow-md transition flex items-center justify-center gap-2">
                            <i class="fas fa-paper-plane"></i> Gửi bài làm
                        </button>
                    `;
                }
                
                let linkHtml = t.link ? `<a href="${t.link}" target="_blank" class="mt-4 inline-block bg-indigo-100 text-indigo-700 border border-indigo-200 hover:bg-indigo-200 font-black text-sm px-6 py-2.5 rounded-xl shadow-sm transition"><i class="fas fa-external-link-alt mr-2"></i>${t.btnText}</a>` : '';

                html += `
                    <div class="task-card bg-white p-6 rounded-2xl shadow-sm border border-slate-200" tabindex="0" data-task="${t.id}" onclick="setActiveTask(${t.id})">
                        <h3 class="text-lg font-black text-slate-800 mb-2"><span class="text-blue-600 mr-2">#${t.id}</span> ${t.title}</h3>
                        <p class="text-sm text-slate-600 font-medium mb-2">${t.desc}</p>
                        ${linkHtml}
                        ${uploadHtml}
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        let activeTaskId = null;
        function setActiveTask(id) { activeTaskId = id; }

        function setupGlobalPaste() {
            document.addEventListener('paste', function(e) {
                if(!activeTaskId) { alert("Vui lòng click chuột vào Nhiệm vụ bạn muốn dán ảnh trước!"); return; }
                const task = TASKS.find(t => t.id === activeTaskId);
                if(!task || !task.requireUpload) return;

                let items = e.clipboardData.items;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf("image") !== -1) {
                        let file = items[i].getAsFile();
                        let newFile = new File([file], "Anh_Dan_" + Math.floor(Math.random()*1000) + ".png", {type: file.type});
                        pendingFiles[activeTaskId].push(newFile);
                        renderTags(activeTaskId);
                    }
                }
            });
        }

        function handleFileSelect(e, taskId) {
            const files = e.target.files;
            for(let i=0; i<files.length; i++) { pendingFiles[taskId].push(files[i]); }
            renderTags(taskId); e.target.value = '';
        }

        function renderTags(taskId) {
            const tagContainer = document.getElementById(`tags_${taskId}`);
            let html = '';
            pendingFiles[taskId].forEach((file, index) => {
                let name = file.name.length > 20 ? file.name.substring(0,20)+'...' : file.name;
                html += `<span class="bg-blue-100 text-blue-800 border border-blue-200 text-xs font-bold px-3 py-1 rounded-full flex items-center gap-1 shadow-sm">🖼️ ${name} <button onclick="event.stopPropagation(); removeFile(${taskId}, ${index})" class="text-red-500 hover:text-red-700 ml-1 text-sm leading-none focus:outline-none">&times;</button></span>`;
            });
            tagContainer.innerHTML = html;
        }

        function removeFile(taskId, index) {
            pendingFiles[taskId].splice(index, 1);
            renderTags(taskId);
        }

        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image(); img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); const MAX_WIDTH = 1200;
                        let width = img.width; let height = img.height;
                        if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
                        canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
                        resolve({ mimeType: 'image/jpeg', base64Data: compressedBase64 });
                    };
                }; reader.onerror = error => reject(error);
            });
        }

        function submitTask(taskId, taskTitle) {
            if(pendingFiles[taskId].length === 0) return alert("Vui lòng đính kèm ít nhất 1 ảnh minh chứng!");
            if(APP_SCRIPT_URL === "https://script.google.com/macros/s/AKfycby9-k7Z5e8A3xXz6c2D1vB0g4hFjKqL9mN8bV5c2D1vB0g4hFj/exec") return alert("LỖI: Chưa cập nhật link Google Apps Script trong code (APP_SCRIPT_URL)!");

            const profile = JSON.parse(localStorage.getItem('kt01_profile'));
            const btn = document.getElementById(`btnSubmit_${taskId}`);
            const oldHtml = btn.innerHTML;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Đang tải lên...`;
            btn.disabled = true; btn.classList.replace('bg-blue-600', 'bg-slate-400');

            let promises = pendingFiles[taskId].map(f => compressImage(f));
            
            Promise.all(promises).then(imagesData => {
                const payload = {
                    studentName: profile.name, department: profile.dept,
                    taskName: taskTitle, images: imagesData
                };
                return fetch(APP_SCRIPT_URL, {
                    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
            }).then(r => r.json()).then(data => {
                if(data.status === 'success') {
                    alert(`🎉 Nộp bài: "${taskTitle}" thành công!`);
                    pendingFiles[taskId] = []; renderTags(taskId);
                    btn.innerHTML = `<i class="fas fa-check-circle"></i> Đã Nộp Xong`;
                    btn.classList.replace('bg-slate-400', 'bg-emerald-600');
                } else alert("Lỗi hệ thống: " + data.message);
            }).catch(err => {
                alert("Lỗi kết nối mạng, vui lòng thử lại!");
                btn.innerHTML = oldHtml; btn.disabled = false; btn.classList.replace('bg-slate-400', 'bg-blue-600');
            });
        }
    </script>
</body>
</html>
