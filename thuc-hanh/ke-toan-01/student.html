<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học viên - Thực hành Kế Toán 01</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #334155; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .tech-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -10; background: #f8fafc; overflow: hidden; pointer-events: none; }
        .glow-blob-1 { position: absolute; top: -10%; left: -10%; width: 50vw; height: 50vw; filter: blur(120px); border-radius: 50%; animation: float 15s ease-in-out infinite; background: rgba(37, 99, 235, 0.08); }
        .glow-blob-2 { position: absolute; bottom: -10%; right: -10%; width: 50vw; height: 50vw; filter: blur(120px); border-radius: 50%; animation: float 18s ease-in-out infinite reverse; background: rgba(16, 185, 129, 0.08); }
        @keyframes float { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(30px) scale(1.05); } }

        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.5); }
        
        .zoom-active { max-height: none !important; cursor: zoom-out !important; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden relative selection:bg-blue-200 selection:text-blue-900">

    <div class="tech-bg"><div class="glow-blob-1"></div><div class="glow-blob-2"></div></div>

    <!-- MODAL CẢNH BÁO QUÊN NỘP BÀI -->
    <div id="warnModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[110] flex items-center justify-center hidden p-4 transition-opacity">
        <div class="bg-white rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl relative border-t-8 border-amber-500">
            <div class="w-16 h-16 rounded-full bg-amber-100 text-amber-500 flex items-center justify-center mx-auto mb-4 text-3xl"><i class="fas fa-exclamation-triangle"></i></div>
            <h2 class="text-xl font-black text-slate-800 text-center mb-2">Khoan đã!</h2>
            <p class="text-slate-600 text-sm text-center mb-6 font-medium">Bạn đã tải ảnh lên nhưng <strong>chưa bấm nút Nộp bài</strong>. Bạn muốn xử lý thế nào?</p>
            <div class="space-y-3">
                <button onclick="document.getElementById('warnModal').classList.add('hidden')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition flex items-center justify-center gap-2">
                    <i class="fas fa-undo"></i> Ở lại trang này để nộp bài
                </button>
                <button onclick="confirmLeave()" class="w-full bg-slate-100 hover:bg-red-50 text-slate-600 hover:text-red-600 font-bold py-3 rounded-xl border border-slate-200 hover:border-red-200 transition flex items-center justify-center gap-2">
                    <i class="fas fa-trash-alt"></i> Xóa ảnh đó & Sang bài mới
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL ĐỊNH DANH -->
    <div id="authModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center hidden p-4">
        <div class="glass-panel rounded-3xl p-8 max-w-md w-full shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 to-indigo-500"></div>
            <h2 class="text-2xl font-black text-slate-800 mb-1 text-center tracking-tight">Đăng nhập hệ thống</h2>
            <p class="text-xs text-blue-600 mb-6 text-center font-bold uppercase tracking-widest">Bài thực hành Kế Toán 01 (KiotViet)</p>
            <div class="space-y-4 relative z-10">
                <div>
                    <label class="block text-xs font-black text-slate-400 uppercase mb-2">Họ và tên của bạn</label>
                    <input type="text" id="inpName" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold text-slate-800 focus:outline-none focus:border-blue-500 shadow-inner transition" placeholder="VD: Nguyễn Văn A">
                </div>
                <div>
                    <label class="block text-xs font-black text-slate-400 uppercase mb-2">Phòng ban</label>
                    <input type="text" id="inpDept" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold text-slate-800 focus:outline-none focus:border-blue-500 shadow-inner transition" placeholder="VD: LND">
                </div>
                <button onclick="saveProfile()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3 rounded-xl transition shadow-lg shadow-blue-500/30 mt-4 text-sm">
                    VÀO LỚP HỌC <i class="fas fa-arrow-right ml-1"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL XEM ẢNH FULLSCREEN -->
    <div id="imgModal" class="fixed inset-0 bg-slate-900/95 backdrop-blur-sm z-[150] hidden flex-col overflow-auto p-4 items-center justify-center">
        <div class="fixed top-4 right-6 flex items-center gap-4 z-50">
            <a id="btnRawImg" href="#" target="_blank" class="px-4 py-2 bg-white/10 hover:bg-white/20 text-white rounded-xl text-sm font-bold transition flex items-center gap-2"><i class="fas fa-external-link-alt"></i> Mở ảnh gốc</a>
            <button onclick="document.getElementById('imgModal').classList.add('hidden')" class="w-10 h-10 bg-white/10 hover:bg-red-500 text-white rounded-xl flex items-center justify-center text-xl transition"><i class="fas fa-times"></i></button>
        </div>
        <p class="fixed top-4 left-6 text-white/50 text-sm font-bold bg-black/40 px-3 py-1 rounded-lg z-50 pointer-events-none hidden md:block"><i class="fas fa-search-plus"></i> Bấm vào ảnh để phóng to kích thước thực</p>
        <img id="fullImg" src="" onclick="toggleZoom(this)" class="max-w-full max-h-[90vh] object-contain rounded shadow-2xl transition-all duration-300 cursor-zoom-in m-auto mt-20 mb-20 border border-white/10">
    </div>

    <!-- HEADER -->
    <header class="glass-header h-16 flex items-center justify-between px-4 md:px-6 z-30 shrink-0 relative">
        <div class="flex items-center gap-4">
            <button onclick="toggleSidebar()" class="md:hidden text-slate-500 text-lg hover:text-blue-600 px-2"><i class="fas fa-bars"></i></button>
            <img src="https://logo.kiotviet.vn/KiotViet-Logo-Horizontal.svg" class="h-6 md:h-7">
            <div class="h-5 w-px bg-slate-300 mx-1 hidden sm:block"></div>
            <span class="font-black text-slate-700 hidden sm:block tracking-tight text-sm md:text-base">Thực hành Kế Toán 01</span>
        </div>
        <div id="studentInfo" class="flex items-center gap-2 bg-white/60 text-blue-700 px-4 py-1.5 rounded-full text-xs font-bold border border-blue-200 cursor-pointer hidden hover:bg-blue-50 transition shadow-sm" onclick="document.getElementById('authModal').classList.remove('hidden')">
            <i class="fas fa-user-circle text-base"></i> <span id="lblStudentName"></span>
        </div>
    </header>

    <!-- BODY (SIDEBAR + MAIN) -->
    <div class="flex flex-1 overflow-hidden relative z-20">
        
        <!-- SIDEBAR -->
        <aside id="sidebar" class="w-72 md:w-[320px] glass-panel border-r-0 border-r border-white/40 flex flex-col z-30 transition-all shrink-0 absolute md:relative inset-y-0 left-0 hidden md:flex shadow-2xl md:shadow-none">
            <div class="h-14 flex items-center px-4 justify-between md:hidden border-b border-slate-200/50">
                <span class="font-black text-slate-700 text-sm">Danh sách bài tập</span>
                <button onclick="toggleSidebar()" class="text-slate-400 hover:text-red-500 text-lg"><i class="fas fa-times"></i></button>
            </div>
            <ul id="stepList" class="flex-1 overflow-y-auto py-4 custom-scrollbar select-none">
                <!-- JS Render Sidebar -->
            </ul>
        </aside>

        <!-- KHUNG MAIN CONTENT -->
        <main class="flex-1 overflow-y-auto custom-scrollbar relative p-4 md:p-8 flex flex-col bg-slate-50/50">
            <div id="mainContent" class="max-w-4xl mx-auto w-full">
                <!-- JS Render Task Content -->
            </div>
            
            <!-- BOTTOM NAVIGATION -->
            <div class="fixed bottom-0 right-0 glass-panel border-t-0 border-t border-slate-200/60 p-4 flex justify-between items-center w-full md:w-[calc(100%-320px)] z-10 shadow-[0_-10px_20px_rgba(0,0,0,0.02)]">
                <button id="btnPrev" onclick="prevStep()" class="flex items-center gap-2 px-5 py-2.5 text-sm text-slate-600 font-bold hover:text-blue-600 hover:bg-blue-50 rounded-xl transition disabled:opacity-30 disabled:hover:bg-transparent disabled:cursor-not-allowed"><i class="fas fa-chevron-left"></i> Lùi lại</button>
                <button id="btnNext" onclick="nextStep()" class="flex items-center gap-2 px-8 py-2.5 text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-lg shadow-blue-500/30 transition font-black text-sm tracking-wide">Tiếp theo <i class="fas fa-arrow-right"></i></button>
            </div>
            <div class="h-24 shrink-0"></div>
        </main>
    </div>

    <script>
        // ============== CẤU HÌNH API ==============
        const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyW79Xpr_j-R_2fEExc_lJggwDUxKQoXas76qoPoRaVsA2VfaZ1yxXCvAZP3hq862bF/exec"; 
        // ==========================================

        const TASKS = [
            { id: 'survey_start', title: "Điểm danh đầu giờ", desc: "Quét mã QR trên màn hình Zoom hoặc nhấn vào nút bên dưới để làm khảo sát đánh giá mức độ tự tin và vướng mắc thực tế.", link: "https://docs.google.com/forms/d/e/1FAIpQLScbcWV7eHhsRVVj7T3DKkHM5HkKIufDwM5pZpPzZLi7zwBa_Q/viewform?usp=sharing&ouid=114233827588486974210", btnText: "Form Khảo Sát", requireUpload: false, isSpecial: true },
            
            { isHeader: true, title: "PHẦN 1: THIẾT LẬP HỒ SƠ KHAI THUẾ" },
            { id: 1, title: "Nhiệm vụ 1: Tạo gian hàng & Import hàng hóa", desc: "Sử dụng tài khoản KiotViet tạo gian hàng dùng thử. Bấm nút Tải File Excel Mẫu bên dưới và thực hiện import lên hệ thống.", link: "https://docs.google.com/spreadsheets/d/1njtTDgUILULm7fvqG1n7AVC7dCkyTejspVFeXTFIzhg/export?format=xlsx&gid=2116083325", btnText: "Tải File Excel Mẫu", requireUpload: true, isDownload: true },
            { id: 2, title: "Nhiệm vụ 2: Thiết lập Hồ sơ khai thuế (Nhóm 1)", desc: "Cài đặt nhóm thuế cho cửa hàng là Nhóm 1 (Miễn thuế).", requireUpload: true },
            { id: 3, title: "Nhiệm vụ 3: Kiểm tra Sổ kế toán & Tờ khai", desc: "Ra quầy bán 1 đơn hàng bất kỳ. Quay lại kiểm tra Sổ kế toán và Tờ khai thuế của Nhóm 1 xem số liệu đã nhảy chưa.", requireUpload: true },
            { id: 4, title: "Nhiệm vụ 4: Đổi thiết lập sang Nhóm 2", desc: "Vào thiết lập đổi cửa hàng sang Nhóm 2. Xem sự thay đổi mẫu sổ và tờ khai trên hệ thống.", requireUpload: true },

            { isHeader: true, title: "PHẦN 2: QUY TRÌNH THIẾT LẬP HÓA ĐƠN ĐIỆN TỬ" },
            { id: 5, title: "Nhiệm vụ 5: Thiết lập thuế GTGT", desc: "Tiến hành cài đặt Thuế GTGT trực tiếp và bật thiết lập Giảm thuế 204 (nếu có).", requireUpload: true },
            { id: 6, title: "Nhiệm vụ 6: Kích hoạt Hóa đơn KiotViet", desc: "Kích hoạt dịch vụ Hóa đơn điện tử ngay trên phần mềm.", requireUpload: true },
            { id: 7, title: "Nhiệm vụ 7: Kết nối HĐĐT với phần mềm Bán hàng", desc: "Thực hiện nhập OTP để 2 hệ thống Bán hàng và Thuế kết nối thành công.", requireUpload: true },

            { id: 'survey_end', title: "Khảo sát khóa học sau đào tạo", desc: "Hoàn thành khảo sát để đánh giá khóa học và nhận lộ trình thi chứng chỉ Kế toán 01.", link: "https://docs.google.com/forms/d/e/1FAIpQLSfUjSF4NzBAf9AQhWhs09eE-a7InRHjAFcc_ZdeqlQl3F7R0A/viewform", btnText: "Form Khảo Sát Cuối Khóa", requireUpload: false, isSpecial: true }
        ];

        let currentStepIndex = 0;
        let pendingFiles = {}; 
        let submittedProgress = JSON.parse(localStorage.getItem('kt01_progress')) || {}; 
        let targetStepIndex = null; 

        document.addEventListener('DOMContentLoaded', () => {
            TASKS.forEach(t => { if(t.id && !t.isHeader) pendingFiles[t.id] = []; });
            checkAuth(); 
            goToStep(0);
            setupGlobalPaste();
        });

        function checkAuth() {
            const profileRaw = localStorage.getItem('kt01_profile');
            if(profileRaw) {
                const profile = JSON.parse(profileRaw);
                document.getElementById('lblStudentName').innerText = profile.name + " - " + profile.dept;
                document.getElementById('studentInfo').classList.remove('hidden');
            } else { document.getElementById('authModal').classList.remove('hidden'); }
        }

        function saveProfile() {
            const name = document.getElementById('inpName').value.trim(); const dept = document.getElementById('inpDept').value.trim();
            if(!name || !dept) return alert("Vui lòng nhập đủ thông tin!");
            localStorage.setItem('kt01_profile', JSON.stringify({name, dept}));
            document.getElementById('authModal').classList.add('hidden'); checkAuth();
        }

        function getDirectImageUrl(url) { 
            let match = url.match(/\/d\/(.+?)\//) || url.match(/id=(.+?)(&|$)/); 
            if(match && match[1]) return `https://lh3.googleusercontent.com/d/${match[1]}`; return url; 
        }

        function toggleSidebar() { 
            document.getElementById('sidebar').classList.toggle('hidden'); 
        }

        // ================= XỬ LÝ ĐIỀU HƯỚNG BÀI TẬP =================
        function renderSidebar() {
            const list = document.getElementById('stepList'); let html = '';
            TASKS.forEach((t, index) => {
                if(t.isHeader) {
                    html += `<li class="mt-6 mb-2 px-5 text-[11px] font-extrabold text-blue-500 uppercase tracking-widest">${t.title}</li>`;
                } else {
                    const isActive = (index === currentStepIndex);
                    const isSubmitted = submittedProgress[t.id] && submittedProgress[t.id].length > 0;
                    const activeClass = isActive ? 'bg-blue-50/80 border-blue-500 text-blue-700 shadow-sm' : 'border-transparent text-slate-600 hover:bg-slate-100 hover:text-slate-800';
                    
                    let iconBadge = '';
                    if(t.isSpecial) iconBadge = `<div class="w-6 h-6 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center text-[10px] font-bold"><i class="fas fa-star"></i></div>`;
                    else iconBadge = isSubmitted 
                            ? `<div class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-[10px] font-bold shadow-sm"><i class="fas fa-check"></i></div>`
                            : `<div class="w-6 h-6 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center text-[10px] font-bold">${t.id}</div>`;

                    html += `
                        <li class="cursor-pointer mx-3 my-1 border-l-4 rounded-r-xl px-3 py-3 transition-all flex items-start gap-3 ${activeClass}" onclick="attemptGoToStep(${index})">
                            <div class="shrink-0 mt-0.5">${iconBadge}</div>
                            <div class="flex-1 text-[13px] font-bold mt-0.5 leading-snug">${t.title.split(': ')[1] || t.title}</div>
                        </li>
                    `;
                }
            });
            list.innerHTML = html;
        }

        function attemptGoToStep(targetIndex) {
            if(window.innerWidth < 768) toggleSidebar(); // Đóng sidebar mobile
            
            const currentTask = TASKS[currentStepIndex];
            if(currentTask && !currentTask.isHeader && pendingFiles[currentTask.id] && pendingFiles[currentTask.id].length > 0) {
                targetStepIndex = targetIndex;
                document.getElementById('warnTaskName').innerText = currentTask.title;
                document.getElementById('warnModal').classList.remove('hidden');
            } else {
                goToStep(targetIndex);
            }
        }

        function confirmLeave() {
            const currentTask = TASKS[currentStepIndex];
            pendingFiles[currentTask.id] = []; 
            document.getElementById('warnModal').classList.add('hidden');
            goToStep(targetStepIndex);
        }

        function goToStep(index) {
            if(index < 0 || index >= TASKS.length) return;
            if(TASKS[index].isHeader) index++; 
            if(index >= TASKS.length) return;

            currentStepIndex = index;
            const t = TASKS[index];
            const isSubmitted = submittedProgress[t.id] && submittedProgress[t.id].length > 0;
            if(!pendingFiles[t.id]) pendingFiles[t.id] = [];

            renderSidebar();

            let uploadHtml = '';
            if(t.requireUpload) {
                if (isSubmitted) {
                    let thumbnails = submittedProgress[t.id].map(url => {
                        let direct = getDirectImageUrl(url);
                        return `<div class="aspect-video bg-slate-100 rounded-xl overflow-hidden border border-slate-200 cursor-zoom-in hover:border-blue-500 transition shadow-sm group relative" onclick="openImage('${direct}', '${url}')">
                                    <img src="${direct}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                                    <div class="absolute inset-0 bg-blue-900/30 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                        <i class="fas fa-search-plus text-white text-2xl drop-shadow-md"></i>
                                    </div>
                                </div>`;
                    }).join('');

                    uploadHtml = `
                        <div class="mt-8 p-5 md:p-6 bg-emerald-50 border border-emerald-200 rounded-2xl shadow-sm">
                            <p class="text-emerald-700 font-black text-sm mb-4 flex items-center gap-2"><i class="fas fa-check-circle text-xl"></i> BẠN ĐÃ NỘP BÀI THÀNH CÔNG</p>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">${thumbnails}</div>
                            
                            <div class="border-t border-emerald-200 pt-4 mt-2">
                                <p class="text-[13px] text-emerald-800 font-medium mb-3">Muốn nộp bổ sung/nộp lại? Tải ảnh mới lên đây:</p>
                                <div class="flex flex-col sm:flex-row gap-3">
                                    <label class="bg-white border border-emerald-200 text-slate-700 px-4 py-2.5 text-sm font-bold rounded-xl cursor-pointer hover:bg-emerald-100 shadow-sm transition flex items-center justify-center gap-2 shrink-0">
                                        <i class="fas fa-upload text-blue-500"></i> Tải ảnh mới
                                        <input type="file" multiple accept="image/*" class="hidden" onchange="handleFileSelect(event, '${t.id}')">
                                    </label>
                                    <span class="text-sm text-slate-500 font-medium bg-white/60 px-4 py-2.5 rounded-xl border border-transparent flex-1 text-center sm:text-left">...hoặc ấn <strong>Ctrl+V</strong> dán ảnh.</span>
                                </div>
                                <div id="tags_${t.id}" class="mt-3 flex flex-wrap gap-2 empty:hidden"></div>
                            </div>
                        </div>
                        <button id="btnSubmit_${t.id}" onclick="submitTask('${t.id}', '${t.title}')" class="mt-6 w-full sm:w-auto bg-blue-100 text-blue-700 hover:bg-blue-200 font-black text-sm px-8 py-3.5 rounded-xl transition flex items-center justify-center gap-2 ml-auto shadow-sm">
                            <i class="fas fa-sync-alt"></i> Cập nhật bài làm
                        </button>
                    `;
                } else {
                    uploadHtml = `
                        <div class="mt-8 p-6 bg-white/60 border-2 border-dashed border-slate-300 hover:border-blue-400 rounded-2xl transition">
                            <div class="flex flex-col sm:flex-row gap-4 items-start sm:items-center">
                                <label class="bg-white border border-slate-200 text-slate-700 px-5 py-3 text-sm font-bold rounded-xl cursor-pointer hover:bg-blue-50 hover:text-blue-600 hover:border-blue-300 shadow-sm transition flex items-center justify-center gap-2 w-full sm:w-auto shrink-0">
                                    <i class="fas fa-cloud-upload-alt text-lg text-blue-500"></i> Tải ảnh lên
                                    <input type="file" multiple accept="image/*" class="hidden" onchange="handleFileSelect(event, '${t.id}')">
                                </label>
                                <span class="text-sm text-slate-500 font-medium flex-1 text-center sm:text-left">Hoặc click chuột vào khung này, nhấn <strong>Ctrl+V</strong> để dán ảnh.</span>
                            </div>
                            <div id="tags_${t.id}" class="mt-4 flex flex-wrap gap-2 empty:hidden"></div>
                        </div>
                        <button id="btnSubmit_${t.id}" onclick="submitTask('${t.id}', '${t.title}')" class="mt-6 w-full sm:w-auto bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-black text-sm px-10 py-3.5 rounded-xl shadow-lg shadow-blue-500/30 transition flex items-center justify-center gap-2 ml-auto">
                            <i class="fas fa-paper-plane"></i> Nộp kết quả
                        </button>
                    `;
                }
            }
            
            let linkHtml = '';
            if(t.link) {
                if(t.isDownload) linkHtml = `<a href="${t.link}" class="mt-5 inline-flex items-center gap-2 bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100 font-black text-sm px-6 py-3.5 rounded-xl shadow-sm transition"><i class="fas fa-file-excel text-emerald-600 text-lg"></i> ${t.btnText}</a>`;
                else linkHtml = `<a href="${t.link}" target="_blank" class="mt-5 inline-flex items-center gap-2 bg-indigo-50 text-indigo-700 border border-indigo-200 hover:bg-indigo-100 font-black text-sm px-6 py-3.5 rounded-xl shadow-sm transition"><i class="fas fa-external-link-alt text-lg text-indigo-500"></i> ${t.btnText}</a>`;
            }

            document.getElementById('mainContent').innerHTML = `
                <div class="glass-panel p-6 md:p-10 rounded-3xl relative border border-white/60">
                    <h1 class="text-2xl md:text-3xl font-black text-slate-800 tracking-tight mb-3">${t.title}</h1>
                    <p class="text-[15px] text-slate-600 font-medium leading-relaxed">${t.desc}</p>
                    ${linkHtml}
                    ${uploadHtml}
                </div>
            `;

            if(pendingFiles[t.id] && pendingFiles[t.id].length > 0) renderTags(t.id);
            updateBottomNav();
            document.querySelector('main').scrollTo(0, 0);
        }

        // ================= BOTTOM NAV PREV NEXT =================
        function updateBottomNav() {
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');
            
            let prevIdx = currentStepIndex - 1;
            while(prevIdx >= 0 && TASKS[prevIdx].isHeader) prevIdx--;
            btnPrev.disabled = (prevIdx < 0);
            
            let nextIdx = currentStepIndex + 1;
            while(nextIdx < TASKS.length && TASKS[nextIdx].isHeader) nextIdx++;
            
            if(nextIdx >= TASKS.length) {
                btnNext.innerHTML = 'Kết thúc <i class="fas fa-flag-checkered ml-1"></i>';
                btnNext.classList.replace('bg-blue-600', 'bg-emerald-600');
                btnNext.classList.replace('hover:bg-blue-700', 'hover:bg-emerald-700');
                btnNext.classList.replace('shadow-blue-500/30', 'shadow-emerald-500/30');
            } else {
                btnNext.innerHTML = 'Tiếp theo <i class="fas fa-arrow-right ml-1"></i>';
                btnNext.classList.replace('bg-emerald-600', 'bg-blue-600');
                btnNext.classList.replace('hover:bg-emerald-700', 'hover:bg-blue-700');
                btnNext.classList.replace('shadow-emerald-500/30', 'shadow-blue-500/30');
            }
        }

        function nextStep() {
            let nextIdx = currentStepIndex + 1;
            while(nextIdx < TASKS.length && TASKS[nextIdx].isHeader) nextIdx++;
            if(nextIdx < TASKS.length) attemptGoToStep(nextIdx);
            else alert("🎉 Chúc mừng bạn đã hoàn thành tất cả nhiệm vụ! Vui lòng làm Khảo sát cuối khóa.");
        }

        function prevStep() {
            let prevIdx = currentStepIndex - 1;
            while(prevIdx >= 0 && TASKS[prevIdx].isHeader) prevIdx--;
            if(prevIdx >= 0) attemptGoToStep(prevIdx);
        }

        // ================= UPLOAD & PASTE ẢNH =================
        function setupGlobalPaste() {
            document.addEventListener('paste', function(e) {
                const task = TASKS[currentStepIndex];
                if(!task || !task.requireUpload) return;

                let items = e.clipboardData.items;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf("image") !== -1) {
                        let file = items[i].getAsFile();
                        let newFile = new File([file], "Anh_Minh_Chung_" + Math.floor(Math.random()*100) + ".png", {type: file.type});
                        pendingFiles[task.id].push(newFile); renderTags(task.id);
                    }
                }
            });
        }

        function handleFileSelect(e, taskId) {
            const files = e.target.files;
            for(let i=0; i<files.length; i++) { pendingFiles[taskId].push(files[i]); }
            renderTags(taskId); e.target.value = '';
        }

        function renderTags(taskId) {
            const tagContainer = document.getElementById(`tags_${taskId}`); if(!tagContainer) return;
            let html = '';
            pendingFiles[taskId].forEach((file, index) => {
                let name = file.name.length > 20 ? file.name.substring(0,20)+'...' : file.name;
                html += `<span class="bg-indigo-50 text-indigo-700 border border-indigo-200 text-[11px] font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 shadow-sm">🖼️ ${name} <button onclick="event.stopPropagation(); removeFile('${taskId}', ${index})" class="text-indigo-400 hover:text-red-500 bg-white rounded-full w-5 h-5 flex items-center justify-center transition focus:outline-none shadow-sm"><i class="fas fa-times"></i></button></span>`;
            });
            tagContainer.innerHTML = html;
        }

        function removeFile(taskId, index) { pendingFiles[taskId].splice(index, 1); renderTags(taskId); }

        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image(); img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); const MAX_WIDTH = 1600; 
                        let width = img.width; let height = img.height;
                        if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
                        canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                        resolve({ mimeType: 'image/jpeg', base64Data: canvas.toDataURL('image/jpeg', 0.85).split(',')[1] });
                    };
                }; reader.onerror = error => reject(error);
            });
        }

        function submitTask(taskId, taskTitle) {
            if(!pendingFiles[taskId] || pendingFiles[taskId].length === 0) return alert("❌ Bạn chưa dán/upload ảnh mới nào!");
            if(APP_SCRIPT_URL.includes("AKfycbyW79Xpr_j")) return alert("LỖI: Hãy thay đổi APP_SCRIPT_URL!");

            const profile = JSON.parse(localStorage.getItem('kt01_profile'));
            const btn = document.getElementById(`btnSubmit_${taskId}`); const oldHtml = btn.innerHTML;
            btn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> Đang nộp bài...`;
            btn.disabled = true; btn.classList.add('opacity-70', 'cursor-not-allowed');

            Promise.all(pendingFiles[taskId].map(f => compressImage(f))).then(imagesData => {
                return fetch(APP_SCRIPT_URL, {
                    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ studentName: profile.name, department: profile.dept, taskName: taskTitle, images: imagesData })
                });
            }).then(r => r.json()).then(data => {
                if(data.status === 'success') {
                    submittedProgress[taskId] = data.urls;
                    localStorage.setItem('kt01_progress', JSON.stringify(submittedProgress));
                    pendingFiles[taskId] = [];
                    goToStep(currentStepIndex); // Tự tải lại form thành trạng thái màu Xanh
                } else alert("Lỗi Server: " + data.message);
            }).catch(err => {
                alert("Mạng chậm, vui lòng bấm nộp lại!");
                btn.innerHTML = oldHtml; btn.disabled = false; btn.classList.remove('opacity-70', 'cursor-not-allowed');
            });
        }

        // ================= ZOOM ẢNH =================
        function openImage(directUrl, rawUrl) {
            document.getElementById('fullImg').src = directUrl;
            document.getElementById('btnRawImg').href = rawUrl;
            document.getElementById('fullImg').classList.remove('zoom-active');
            document.getElementById('imgModal').classList.remove('hidden');
            document.getElementById('imgModal').classList.add('flex');
        }

        function toggleZoom(imgEl) { imgEl.classList.toggle('zoom-active'); }
    </script>
</body>
</html>
