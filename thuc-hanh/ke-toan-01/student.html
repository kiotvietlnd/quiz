<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học viên - Thực hành Kế Toán 01</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #334155; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        
        .tech-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -10; background: #f8fafc; overflow: hidden; pointer-events: none; }
        .glow-blob-1 { position: absolute; top: -10%; left: -10%; width: 50vw; height: 50vw; filter: blur(120px); border-radius: 50%; animation: float 15s ease-in-out infinite; background: rgba(37, 99, 235, 0.08); }
        .glow-blob-2 { position: absolute; bottom: -10%; right: -10%; width: 50vw; height: 50vw; filter: blur(120px); border-radius: 50%; animation: float 18s ease-in-out infinite reverse; background: rgba(16, 185, 129, 0.08); }
        @keyframes float { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(30px) scale(1.05); } }

        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.5); }
        
        .task-card { transition: all 0.2s ease; }
        .task-card:focus-within { border-color: rgba(59, 130, 246, 0.4); box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.1); transform: translateY(-2px); }
    </style>
</head>
<body class="relative min-h-screen selection:bg-blue-200 selection:text-blue-900">

    <div class="tech-bg"><div class="glow-blob-1"></div><div class="glow-blob-2"></div></div>

    <!-- MODAL ĐỊNH DANH -->
    <div id="authModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center hidden p-4">
        <div class="glass-panel rounded-3xl p-8 max-w-md w-full shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 to-indigo-500"></div>
            <h2 class="text-2xl font-black text-slate-800 mb-1 text-center tracking-tight">Đăng nhập hệ thống</h2>
            <p class="text-xs text-blue-600 mb-6 text-center font-bold uppercase tracking-widest">Khóa học Kế Toán 01 (KiotViet)</p>
            <div class="space-y-4 relative z-10">
                <div>
                    <label class="block text-xs font-black text-slate-400 uppercase mb-2">Họ và tên của bạn</label>
                    <input type="text" id="inpName" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold text-slate-800 focus:outline-none focus:border-blue-500 shadow-inner transition" placeholder="VD: Nguyễn Văn A">
                </div>
                <div>
                    <label class="block text-xs font-black text-slate-400 uppercase mb-2">Phòng ban</label>
                    <input type="text" id="inpDept" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold text-slate-800 focus:outline-none focus:border-blue-500 shadow-inner transition" placeholder="VD: LND">
                </div>
                <button onclick="saveProfile()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3 rounded-xl transition shadow-lg shadow-blue-500/30 mt-4 text-sm">
                    VÀO LỚP HỌC <i class="fas fa-arrow-right ml-1"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header class="glass-header sticky top-0 z-50 h-16 flex items-center justify-between px-4 md:px-8">
        <div class="flex items-center gap-3">
            <img src="https://logo.kiotviet.vn/KiotViet-Logo-Horizontal.svg" class="h-6 md:h-7">
            <div class="h-5 w-px bg-slate-300 mx-2"></div>
            <span class="font-black text-slate-700 hidden sm:block">Thực hành Kế Toán 01</span>
        </div>
        <div id="studentInfo" class="flex items-center gap-2 bg-slate-100 text-blue-700 px-4 py-1.5 rounded-full text-xs font-bold border border-slate-200 cursor-pointer hidden hover:bg-blue-50 transition" onclick="document.getElementById('authModal').classList.remove('hidden')">
            <i class="fas fa-user-circle text-base"></i> <span id="lblStudentName"></span>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-3xl mx-auto p-4 md:p-8 space-y-6 md:space-y-8 pb-24" id="taskListContainer">
        <!-- Render bằng Javascript -->
    </main>

    <script>
        // ============== CẤU HÌNH API ==============
        const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvqEWis-OVNgN2HQs3PyVt8RZ0GoGIqjN19KejVUJgCAFT2k2kBdD8cgiOOw88MetH/exec"; 
        // ==========================================

        const TASKS = [
            { id: 'survey_start', title: "Điểm danh đầu giờ", desc: "Quét mã QR trên màn hình Zoom hoặc nhấn vào nút bên dưới để làm khảo sát đánh giá mức độ tự tin và vướng mắc thực tế.", link: "https://docs.google.com/forms/d/e/1FAIpQLScbcWV7eHhsRVVj7T3DKkHM5HkKIufDwM5pZpPzZLi7zwBa_Q/viewform?usp=sharing&ouid=114233827588486974210", btnText: "Form Khảo Sát", requireUpload: false, isSpecial: true },
            
            { isHeader: true, title: "PHẦN 1: THIẾT LẬP HỒ SƠ KHAI THUẾ" },
            { id: 1, title: "Nhiệm vụ 1: Tạo gian hàng & Import hàng hóa", desc: "Sử dụng tài khoản KiotViet tạo gian hàng dùng thử. Bấm nút Tải File Excel Mẫu bên dưới và thực hiện import lên hệ thống.", link: "https://docs.google.com/spreadsheets/d/1njtTDgUILULm7fvqG1n7AVC7dCkyTejspVFeXTFIzhg/export?format=xlsx&gid=2116083325", btnText: "Tải File Excel Mẫu", requireUpload: true, isDownload: true },
            { id: 2, title: "Nhiệm vụ 2: Thiết lập Hồ sơ khai thuế (Nhóm 1)", desc: "Cài đặt nhóm thuế cho cửa hàng là Nhóm 1 (Miễn thuế).", requireUpload: true },
            { id: 3, title: "Nhiệm vụ 3: Kiểm tra Sổ kế toán & Tờ khai", desc: "Ra quầy bán 1 đơn hàng bất kỳ. Quay lại kiểm tra Sổ kế toán và Tờ khai thuế của Nhóm 1 xem số liệu đã nhảy chưa.", requireUpload: true },
            { id: 4, title: "Nhiệm vụ 4: Đổi thiết lập sang Nhóm 2", desc: "Vào thiết lập đổi cửa hàng sang Nhóm 2. Xem sự thay đổi mẫu sổ và tờ khai trên hệ thống.", requireUpload: true },

            { isHeader: true, title: "PHẦN 2: QUY TRÌNH THIẾT LẬP HÓA ĐƠN ĐIỆN TỬ" },
            { id: 5, title: "Nhiệm vụ 5: Thiết lập thuế GTGT", desc: "Tiến hành cài đặt Thuế GTGT trực tiếp và bật thiết lập Giảm thuế 204 (nếu có).", requireUpload: true },
            { id: 6, title: "Nhiệm vụ 6: Kích hoạt Hóa đơn KiotViet", desc: "Kích hoạt dịch vụ Hóa đơn điện tử ngay trên phần mềm.", requireUpload: true },
            { id: 7, title: "Nhiệm vụ 7: Kết nối HĐĐT với phần mềm Bán hàng", desc: "Thực hiện nhập OTP để 2 hệ thống Bán hàng và Thuế kết nối thành công.", requireUpload: true },

            { id: 'survey_end', title: "Khảo sát khóa học sau đào tạo", desc: "Hoàn thành khảo sát để đánh giá khóa học và nhận lộ trình thi chứng chỉ Kế toán 01.", link: "https://docs.google.com/forms/d/e/1FAIpQLSfUjSF4NzBAf9AQhWhs09eE-a7InRHjAFcc_ZdeqlQl3F7R0A/viewform", btnText: "Form Khảo Sát Cuối Khóa", requireUpload: false, isSpecial: true }
        ];

        let pendingFiles = {}; 
        let submittedProgress = JSON.parse(localStorage.getItem('kt01_progress')) || {}; // Lưu link ảnh đã nộp

        document.addEventListener('DOMContentLoaded', () => {
            checkAuth(); renderTasks(); setupGlobalPaste();
        });

        function checkAuth() {
            const profileRaw = localStorage.getItem('kt01_profile');
            if(profileRaw) {
                const profile = JSON.parse(profileRaw);
                document.getElementById('lblStudentName').innerText = profile.name + " - " + profile.dept;
                document.getElementById('studentInfo').classList.remove('hidden');
            } else { document.getElementById('authModal').classList.remove('hidden'); }
        }

        function saveProfile() {
            const name = document.getElementById('inpName').value.trim(); const dept = document.getElementById('inpDept').value.trim();
            if(!name || !dept) return alert("Vui lòng nhập đủ thông tin!");
            localStorage.setItem('kt01_profile', JSON.stringify({name, dept}));
            document.getElementById('authModal').classList.add('hidden'); checkAuth();
        }

        function getDirectImageUrl(url) { 
            let match = url.match(/\/d\/(.+?)\//) || url.match(/id=(.+?)(&|$)/); 
            if(match && match[1]) return `https://lh3.googleusercontent.com/d/${match[1]}`; return url; 
        }

        function renderTasks() {
            const container = document.getElementById('taskListContainer'); let html = '';
            TASKS.forEach(t => {
                if (t.isHeader) {
                    html += `<div class="mt-8 mb-4 border-b-2 border-blue-200 pb-2"><h2 class="text-sm font-black text-blue-800 uppercase tracking-widest"><i class="fas fa-layer-group mr-2"></i>${t.title}</h2></div>`;
                    return;
                }

                pendingFiles[t.id] = []; 
                let uploadHtml = '';
                
                // KIỂM TRA ĐÃ NỘP BÀI CHƯA
                const hasSubmitted = submittedProgress[t.id] && submittedProgress[t.id].length > 0;

                if(t.requireUpload) {
                    if (hasSubmitted) {
                        // NẾU ĐÃ NỘP -> HIỂN THỊ ẢNH ĐÃ NỘP VÀ NÚT NỘP LẠI
                        let thumbnails = submittedProgress[t.id].map(url => {
                            let direct = getDirectImageUrl(url);
                            return `<div class="aspect-video bg-slate-100 rounded-lg overflow-hidden border border-slate-200"><img src="${direct}" class="w-full h-full object-cover"></div>`;
                        }).join('');

                        uploadHtml = `
                            <div class="mt-4 p-4 bg-emerald-50 border border-emerald-200 rounded-xl">
                                <p class="text-emerald-700 font-bold text-sm mb-3 flex items-center gap-2"><i class="fas fa-check-circle text-lg"></i> Bạn đã nộp bài thành công</p>
                                <div class="grid grid-cols-2 md:grid-cols-3 gap-2">${thumbnails}</div>
                                <div class="mt-4 border-t border-emerald-100 pt-3">
                                    <p class="text-xs text-slate-500 font-medium mb-2">Muốn nộp bổ sung hoặc nộp lại? Dán ảnh mới vào đây:</p>
                                    <div class="flex flex-col sm:flex-row items-start sm:items-center gap-3">
                                        <label class="bg-white border border-slate-200 text-slate-700 px-3 py-1.5 text-xs font-bold rounded-md cursor-pointer hover:bg-slate-100 shadow-sm transition">
                                            <i class="fas fa-upload text-blue-500"></i> Tải ảnh mới
                                            <input type="file" multiple accept="image/*" class="hidden" onchange="handleFileSelect(event, '${t.id}')">
                                        </label>
                                    </div>
                                    <div id="tags_${t.id}" class="mt-2 flex flex-wrap gap-2 empty:hidden"></div>
                                </div>
                            </div>
                            <button id="btnSubmit_${t.id}" onclick="submitTask('${t.id}', '${t.title}')" class="mt-4 w-full sm:w-auto bg-blue-100 text-blue-700 hover:bg-blue-200 font-bold text-sm px-6 py-2 rounded-xl transition flex items-center justify-center gap-2 ml-auto">
                                <i class="fas fa-sync-alt"></i> Cập nhật bài làm
                            </button>
                        `;
                    } else {
                        // CHƯA NỘP -> HIỂN THỊ KHUNG UPLOAD BÌNH THƯỜNG
                        uploadHtml = `
                            <div class="mt-4 p-3 bg-slate-50 border border-dashed border-slate-300 hover:border-blue-400 rounded-xl transition">
                                <div class="flex flex-col sm:flex-row items-start sm:items-center gap-3">
                                    <label class="bg-white border border-slate-200 text-slate-700 px-4 py-2 text-sm font-bold rounded-lg cursor-pointer hover:bg-slate-100 shadow-sm transition flex items-center gap-2 shrink-0">
                                        <i class="fas fa-upload text-blue-500"></i> Tải ảnh lên
                                        <input type="file" multiple accept="image/*" class="hidden" onchange="handleFileSelect(event, '${t.id}')">
                                    </label>
                                    <span class="text-[12px] text-slate-500 font-medium">Hoặc click vào khung, ấn <strong>Ctrl+V</strong> dán ảnh.</span>
                                </div>
                                <div id="tags_${t.id}" class="mt-3 flex flex-wrap gap-2 empty:hidden"></div>
                            </div>
                            <button id="btnSubmit_${t.id}" onclick="submitTask('${t.id}', '${t.title}')" class="mt-4 w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm px-6 py-2.5 rounded-xl shadow-md transition flex items-center justify-center gap-2 ml-auto">
                                <i class="fas fa-paper-plane"></i> Nộp kết quả
                            </button>
                        `;
                    }
                }
                
                let linkHtml = '';
                if(t.link) {
                    if(t.isDownload) {
                        linkHtml = `<a href="${t.link}" class="mt-3 inline-flex items-center gap-2 bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100 font-bold text-sm px-5 py-2.5 rounded-xl shadow-sm transition"><i class="fas fa-file-excel text-emerald-600"></i> ${t.btnText}</a>`;
                    } else {
                        linkHtml = `<a href="${t.link}" target="_blank" class="mt-3 inline-flex items-center gap-2 bg-indigo-50 text-indigo-700 border border-indigo-200 hover:bg-indigo-100 font-bold text-sm px-5 py-2.5 rounded-xl shadow-sm transition"><i class="fas fa-external-link-alt"></i> ${t.btnText}</a>`;
                    }
                }

                let badgeHtml = t.isSpecial ? `<div class="w-10 h-10 rounded-full bg-amber-100 text-amber-600 font-black flex items-center justify-center shrink-0 shadow-inner mt-0.5"><i class="fas fa-star"></i></div>` 
                                            : `<div class="w-10 h-10 rounded-full ${hasSubmitted ? 'bg-emerald-100 text-emerald-600' : 'bg-blue-100 text-blue-600'} font-black flex items-center justify-center shrink-0 shadow-inner mt-0.5">${hasSubmitted ? '<i class="fas fa-check"></i>' : t.id}</div>`;

                html += `
                    <div class="task-card glass-panel p-5 md:p-6 rounded-2xl" tabindex="0" data-task="${t.id}" onclick="setActiveTask('${t.id}')">
                        <div class="flex items-start gap-3">
                            ${badgeHtml}
                            <div class="w-full">
                                <h3 class="text-base font-bold text-slate-800 mb-1">${t.title}</h3>
                                <p class="text-sm text-slate-500 font-medium leading-relaxed">${t.desc}</p>
                                ${linkHtml}
                                ${uploadHtml}
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        let activeTaskId = null;
        function setActiveTask(id) { activeTaskId = id; }

        function setupGlobalPaste() {
            document.addEventListener('paste', function(e) {
                if(!activeTaskId) { alert("💡 Bạn hãy click chuột vào khung Nhiệm vụ muốn nộp trước khi dán ảnh nhé!"); return; }
                const task = TASKS.find(t => t.id == activeTaskId);
                if(!task || !task.requireUpload) return;

                let items = e.clipboardData.items;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf("image") !== -1) {
                        let file = items[i].getAsFile();
                        let newFile = new File([file], "Anh_Minh_Chung_" + Math.floor(Math.random()*100) + ".png", {type: file.type});
                        pendingFiles[activeTaskId].push(newFile); renderTags(activeTaskId);
                    }
                }
            });
        }

        function handleFileSelect(e, taskId) {
            const files = e.target.files;
            for(let i=0; i<files.length; i++) { pendingFiles[taskId].push(files[i]); }
            renderTags(taskId); e.target.value = '';
        }

        function renderTags(taskId) {
            const tagContainer = document.getElementById(`tags_${taskId}`); let html = '';
            pendingFiles[taskId].forEach((file, index) => {
                let name = file.name.length > 20 ? file.name.substring(0,20)+'...' : file.name;
                html += `<span class="bg-indigo-50 text-indigo-700 border border-indigo-200 text-xs font-semibold px-2.5 py-1 rounded-lg flex items-center gap-1 shadow-sm">🖼️ ${name} <button onclick="event.stopPropagation(); removeFile('${taskId}', ${index})" class="text-indigo-400 hover:text-red-500 bg-white rounded-full w-4 h-4 flex items-center justify-center transition focus:outline-none"><i class="fas fa-times text-[10px]"></i></button></span>`;
            });
            tagContainer.innerHTML = html;
        }

        function removeFile(taskId, index) { pendingFiles[taskId].splice(index, 1); renderTags(taskId); }

        // NÉN ẢNH MẠNH HƠN (Giảm load hệ thống): width max 800px, quality 0.6
        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image(); img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); const MAX_WIDTH = 800;
                        let width = img.width; let height = img.height;
                        if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
                        canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                        resolve({ mimeType: 'image/jpeg', base64Data: canvas.toDataURL('image/jpeg', 0.6).split(',')[1] });
                    };
                }; reader.onerror = error => reject(error);
            });
        }

        function submitTask(taskId, taskTitle) {
            if(pendingFiles[taskId].length === 0) return alert("❌ Bạn chưa dán/upload ảnh mới nào!");
            if(APP_SCRIPT_URL.includes("AKfycby9-k7Z")) return alert("LỖI: Hãy thay đổi APP_SCRIPT_URL!");

            const profile = JSON.parse(localStorage.getItem('kt01_profile'));
            const btn = document.getElementById(`btnSubmit_${taskId}`); const oldHtml = btn.innerHTML;
            btn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> Đang đẩy dữ liệu...`;
            btn.disabled = true; btn.classList.add('opacity-70', 'cursor-not-allowed');

            Promise.all(pendingFiles[taskId].map(f => compressImage(f))).then(imagesData => {
                return fetch(APP_SCRIPT_URL, {
                    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ studentName: profile.name, department: profile.dept, taskName: taskTitle, images: imagesData })
                });
            }).then(r => r.json()).then(data => {
                if(data.status === 'success') {
                    // LƯU KẾT QUẢ VÀO TRÌNH DUYỆT ĐỂ XEM LẠI
                    submittedProgress[taskId] = data.urls;
                    localStorage.setItem('kt01_progress', JSON.stringify(submittedProgress));
                    
                    pendingFiles[taskId] = [];
                    renderTasks(); // Render lại để hiển thị ảnh vừa nộp
                } else alert("Lỗi Server: " + data.message);
            }).catch(err => {
                alert("Mạng chậm, vui lòng bấm nộp lại!");
                btn.innerHTML = oldHtml; btn.disabled = false; btn.classList.remove('opacity-70', 'cursor-not-allowed');
            });
        }
    </script>
</body>
</html>
