<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head> 
    <link rel="icon" type="image/png" href="https://cdn-kvweb.kiotviet.vn/kiotviet-website/wp-content/uploads/2023/10/31095822/64x64.png" sizes="64x64">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHẤM BÀI THỰC HÀNH TÁI KÝ</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts Preconnect giúp tải Font Inter nhanh -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; font-size: 14px; -webkit-tap-highlight-color: transparent; color: #334155; background-color: #cbd5e1; }
        .tech-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -10; background: #cbd5e1; }
        .glow-blob-1, .glow-blob-2 { position: absolute; width: 50vw; height: 50vw; filter: blur(140px); border-radius: 50%; transition: background 1.5s ease-in-out; }
        .glow-blob-1 { top: -15%; left: -10%; background: rgba(37, 99, 235, 0.05); } 
        .glow-blob-2 { bottom: -15%; right: -10%; background: rgba(16, 185, 129, 0.05); }
        
        /* Ultra Glassmorphism Panel (Nền sáng) */
        .glass-panel-ultra { 
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0.92)); 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px); 
            border: 1px solid rgba(226, 232, 240, 0.8); 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.03), inset 0 1px 0 rgba(255, 255, 255, 1); 
        }
        
        /* Dark Navy Glassmorphism Panel (Nền tối dùng cho Sidebar) */
        .glass-panel-dark {
            background: rgba(27, 54, 93, 0.98);
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 4px 0 24px rgba(27, 54, 93, 0.2);
        }

        .scifi-btn { 
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            padding: 12px 24px; 
            border-radius: 12px; 
            font-weight: 700; 
            font-size: 13px; 
            background: #2563eb; 
            color: white; 
            transition: all 0.3s; 
        }
        .scifi-btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 12px 24px -8px rgba(37, 99, 235, 0.4); 
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; } 
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="h-screen flex overflow-hidden selection:bg-blue-200 selection:text-blue-900 relative">

    <div class="tech-bg"><div class="glow-blob-1" id="blob-1"></div><div class="glow-blob-2" id="blob-2"></div></div>

    <!-- SIDEBAR BỘ LỌC (Màu Xanh Navy Đậm Kính mờ) -->
    <aside id="sidebar" class="w-72 glass-panel-dark flex flex-col z-30 transition-all duration-300 flex-shrink-0 text-sm relative overflow-hidden">
        <div class="h-16 flex items-center px-6 border-b border-white/10 flex-shrink-0 justify-between relative z-10">
            <span class="text-sm font-extrabold text-white tracking-widest uppercase flex items-center gap-2"><i class="fas fa-filter text-blue-400"></i> BỘ LỌC TÌM KIẾM</span>
        </div>
        
        <div class="p-6 flex-1 overflow-y-auto flex flex-col custom-scrollbar relative z-10 space-y-5">
            <div class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold text-amber-300 uppercase tracking-wider mb-1.5"><i class="fas fa-filter"></i> Trạng thái bài làm</label>
                    <select id="filterStatus" onchange="renderCards()" class="w-full bg-white text-slate-800 border border-slate-300 text-xs rounded-xl h-[38px] focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 px-3 font-semibold cursor-pointer truncate transition-all">
                        <option value="all">Tất cả bài nộp</option>
                        <option value="pending" selected>🔴 Cần chấm (Chưa nhận xét)</option>
                        <option value="graded">✅ Đã chấm (Có nhận xét)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider mb-1.5">Ngành hàng</label>
                    <select id="filterIndustry" onchange="updateFilters('industry')" class="w-full bg-white text-slate-800 border border-slate-300 text-xs rounded-xl h-[38px] focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 px-3 font-semibold cursor-pointer truncate transition-all">
                        <option value="all">Tất cả Ngành hàng</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider mb-1.5">Mã Lớp / Phòng ban</label>
                    <select id="filterDept" onchange="updateFilters('dept')" class="w-full bg-white text-slate-800 border border-slate-300 text-xs rounded-xl h-[38px] focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 px-3 font-semibold cursor-pointer truncate transition-all">
                        <option value="all">Tất cả Mã Lớp / PB</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider mb-1.5">Học viên</label>
                    <select id="filterStudent" onchange="renderCards()" class="w-full bg-white text-slate-800 border border-slate-300 text-xs rounded-xl h-[38px] focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 px-3 font-semibold cursor-pointer truncate transition-all">
                        <option value="all">Tất cả Học viên</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider mb-1.5">Buổi học</label>
                    <select id="filterSession" onchange="updateFilters('session')" class="w-full bg-white text-slate-800 border border-slate-300 text-xs rounded-xl h-[38px] focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 px-3 font-semibold cursor-pointer truncate transition-all">
                        <option value="all">Tất cả Buổi</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider mb-1.5">Tên Bài tập</label>
                    <select id="filterExercise" onchange="renderCards()" class="w-full bg-white text-slate-800 border border-slate-300 text-xs rounded-xl h-[38px] focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 px-3 font-semibold cursor-pointer truncate transition-all">
                        <option value="all">Tất cả Bài tập</option>
                    </select>
                </div>
            </div>
        </div>
        
        <div class="p-6 border-t border-white/10 bg-[#122543]/40 backdrop-blur-md flex-shrink-0 flex flex-col gap-2 relative z-10">
            <button onclick="fetchPracticeData()" class="w-full h-11 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl shadow-md flex items-center justify-center gap-2 transition-all">
                <i class="fas fa-sync-alt"></i> TẢI LẠI DỮ LIỆU
            </button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative w-full z-10 bg-slate-200/80 backdrop-blur-[2px]">
        <!-- HEADER -->
        <header class="h-16 bg-[#1b365d] border-b border-[#122543] px-6 py-4 flex items-center justify-between shadow-md shrink-0 w-full z-50">
            <div class="flex items-center gap-3">
                <span class="w-8 h-8 rounded-lg bg-blue-900/50 text-blue-300 flex items-center justify-center text-sm"><i class="fas fa-chalkboard-teacher"></i></span>
                <h1 class="text-xs md:text-sm font-bold text-white tracking-wider uppercase">TRUNG TÂM CHẤM BÀI TRỰC TUYẾN TÁI KÝ</h1>
            </div>
        </header>

        <div class="flex-1 overflow-auto p-6 md:p-8 relative pb-28 custom-scrollbar">
            <div class="max-w-5xl mx-auto w-full">
                
                <!-- BẢNG THỐNG KÊ TỔNG QUAN (ĐÃ NÂNG CẤP THEO NGÀNH) -->
                <div id="statsSummary" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-8 z-10 relative hidden">
                    <div class="glass-panel-ultra p-4 rounded-3xl flex items-center gap-4 border border-slate-100 shadow-sm">
                        <div class="h-12 w-12 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center text-xl flex-shrink-0"><i class="fas fa-users"></i></div>
                        <div class="overflow-hidden">
                            <p class="text-[10px] font-black uppercase text-slate-400 tracking-wider">Học Viên Retail</p>
                            <p class="text-sm font-bold text-slate-800 truncate" id="statRetailStudents">0</p>
                        </div>
                    </div>
                    <div class="glass-panel-ultra p-4 rounded-3xl flex items-center gap-4 border border-slate-100 shadow-sm">
                        <div class="h-12 w-12 rounded-2xl bg-orange-50 text-orange-600 flex items-center justify-center text-xl flex-shrink-0"><i class="fas fa-users-viewfinder"></i></div>
                        <div class="overflow-hidden">
                            <p class="text-[10px] font-black uppercase text-slate-400 tracking-wider">Học Viên FNB</p>
                            <p class="text-sm font-bold text-slate-800 truncate" id="statFnbStudents">0</p>
                        </div>
                    </div>
                    <div class="glass-panel-ultra p-4 rounded-3xl flex items-center gap-4 border border-slate-100 shadow-sm">
                        <div class="h-12 w-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl flex-shrink-0"><i class="fas fa-check-double"></i></div>
                        <div>
                            <p class="text-[10px] font-black uppercase text-slate-400 tracking-wider">Tổng Đã Chấm</p>
                            <p class="text-sm font-bold text-emerald-600" id="statGraded">0 bài</p>
                        </div>
                    </div>
                    <div class="glass-panel-ultra p-4 rounded-3xl flex items-center gap-4 border border-rose-100 shadow-sm bg-rose-50/30">
                        <div class="h-12 w-12 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center text-xl flex-shrink-0 animate-pulse"><i class="fas fa-bell"></i></div>
                        <div>
                            <p class="text-[10px] font-black uppercase text-rose-500 tracking-wider">Cần Chấm Gấp</p>
                            <p class="text-sm font-bold text-rose-600" id="statPending">0 bài</p>
                        </div>
                    </div>
                </div>

                <!-- KHUNG TIẾN ĐỘ CÁ NHÂN (CHỈ HIỆN KHI CHỌN 1 HỌC VIÊN + 1 BUỔI) -->
                <div id="studentProgressPanel" class="hidden glass-panel-ultra p-6 rounded-3xl border border-blue-200 mb-8 shadow-md relative overflow-hidden">
                    <div class="absolute right-0 top-0 w-32 h-full bg-gradient-to-l from-blue-50 to-transparent opacity-50"></div>
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 relative z-10">
                        <div>
                            <h3 class="text-lg font-black text-blue-800 flex items-center gap-2"><i class="fas fa-chart-pie"></i> BÁO CÁO TIẾN ĐỘ CÁ NHÂN</h3>
                            <p class="text-xs font-medium text-slate-500 mt-1" id="progressStudentInfo">Học viên: -- | Lớp: -- | Buổi: --</p>
                        </div>
                        <div class="flex-1 max-w-md w-full">
                            <div class="flex justify-between items-end mb-2">
                                <span class="text-xs font-bold text-slate-600" id="progressText">Đã làm: 0/0 bài</span>
                                <span class="text-2xl font-black text-[#166def]" id="progressPercent">0%</span>
                            </div>
                            <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
                                <div id="progressBarFill" class="bg-[#166def] h-full rounded-full transition-all duration-700 w-0"></div>
                            </div>
                        </div>
                    </div>
                    <!-- Danh sách bài thiếu cảnh báo đỏ -->
                    <div id="missingExercisesAlert" class="mt-5 pt-4 border-t border-slate-100 hidden">
                        <p class="text-xs font-black text-rose-600 uppercase tracking-wider mb-2 flex items-center gap-1.5"><i class="fas fa-exclamation-triangle"></i> Cảnh báo: Các bài tập chưa làm</p>
                        <div id="missingExercisesList" class="flex flex-wrap gap-2"></div>
                    </div>
                </div>

                <!-- Chờ Load Data -->
                <div id="loadingSpinner" class="flex flex-col items-center justify-center py-20 hidden">
                    <div class="w-12 h-12 border-4 border-slate-300 border-t-blue-600 rounded-full animate-spin mb-4"></div>
                    <p class="font-bold text-slate-700 text-sm">Đang tải và đồng bộ dữ liệu...</p>
                </div>

                <div id="exercisesContainer" class="space-y-6"></div>

            </div>
        </div>
    </main>

    <!-- FULLSCREEN ẢNH MODAL -->
    <div id="fullscreenModal" class="fixed inset-0 bg-slate-950/95 z-[150] hidden flex-col justify-between items-center p-4 transition-all">
        <div class="w-full flex justify-between items-center px-4 md:px-10 h-16 shrink-0">
            <span id="fullscreenModalCount" class="text-xs font-bold text-slate-400">Ảnh 1 / 1</span>
            <div class="flex items-center gap-3">
                <a id="fullscreenModalRawBtn" href="#" target="_blank" class="px-4 py-2 bg-white/10 hover:bg-white/20 text-white rounded-xl text-xs font-bold transition-all flex items-center gap-1.5"><i class="fas fa-external-link-alt"></i> Xem ảnh gốc</a>
                <button onclick="closeFullscreenModal()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white/10 hover:bg-red-500/20 text-white hover:text-red-400 transition-colors"><i class="fas fa-times text-lg"></i></button>
            </div>
        </div>
        <div class="relative flex-1 w-full flex items-center justify-center max-h-[calc(100vh-140px)] select-none">
            <button id="fullscreenModalPrev" onclick="changeFullscreenImg(-1)" class="absolute left-4 w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center border border-white/5"><i class="fas fa-chevron-left text-lg"></i></button>
            <img id="fullscreenModalImg" src="" class="max-w-full max-h-full object-contain rounded-lg shadow-2xl">
            <button id="fullscreenModalNext" onclick="changeFullscreenImg(1)" class="absolute right-4 w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center border border-white/5"><i class="fas fa-chevron-right text-lg"></i></button>
        </div>
        <div class="h-8 shrink-0"></div>
    </div>

    <!-- Script kết nối API & Xử lý lọc dữ liệu -->
    <script src="codelab-data.js"></script>
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw02rPVB0jTVQGvqVfJTYvoy3OjBz604srivuUOGmSHCdcnQ9tbHF4XI8zo32zxLz_S/exec";
        let allData = [];
        let activeSlides = {};

        document.addEventListener('DOMContentLoaded', fetchPracticeData);

        function fetchPracticeData() {
            document.getElementById('loadingSpinner').classList.remove('hidden');
            const container = document.getElementById('exercisesContainer');
            if(container) container.innerHTML = "";
            document.getElementById('statsSummary').classList.add('hidden');
            document.getElementById('studentProgressPanel').classList.add('hidden');
            
            fetch(`${API_URL}?action=getAllPracticeData`)
            .then(r => r.json()).then(res => {
                if(res.status === 'success') {
                    allData = res.data.reverse(); 
                    initFilters();
                    calculateDashboardStats();
                } else {
                    throw new Error(res.message || "Lỗi dữ liệu từ Server");
                }
            }).catch(e => {
                console.error("Fetch error: ", e);
                const containerEl = document.getElementById('exercisesContainer');
                if(containerEl) {
                    containerEl.innerHTML = `<div class="bg-red-50 border border-red-200 p-6 text-center text-red-600 rounded-2xl"><i class="fas fa-exclamation-triangle text-3xl mb-3"></i><p class="font-bold">Đã xảy ra lỗi khi hiển thị dữ liệu.</p><p class="text-xs mt-1">Hệ thống phát hiện có bài nộp bị thiếu thông tin cốt lõi.</p></div>`;
                }
            })
            .finally(() => document.getElementById('loadingSpinner').classList.add('hidden'));
        }

        // HÀM FORMAT THỜI GIAN (Vd: 14:30 Thứ Ba, 21/07/2026)
        function formatDateTime(isoString) {
            if (!isoString) return '';
            const d = new Date(isoString);
            if (isNaN(d.getTime())) return isoString;
            const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
            const hh = String(d.getHours()).padStart(2, '0');
            const mm = String(d.getMinutes()).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            const mo = String(d.getMonth() + 1).padStart(2, '0');
            const yyyy = d.getFullYear();
            return `${hh}:${mm} - ${days[d.getDay()]}, ${dd}/${mo}/${yyyy}`;
        }

        function calculateDashboardStats() {
            let uniqueRetail = new Set();
            let uniqueFnb = new Set();
            let gradedCount = 0;
            let pendingCount = 0;

            allData.forEach(e => {
                const key = `${e.hoVaTen}|${e.phongBan}`;
                if (e.khoa === "Retail") uniqueRetail.add(key);
                if (e.khoa === "FNB") uniqueFnb.add(key);
                
                if (e.nhanXet && e.nhanXet.toString().trim() !== "") gradedCount++;
                else pendingCount++;
            });

            document.getElementById('statRetailStudents').innerText = uniqueRetail.size;
            document.getElementById('statFnbStudents').innerText = uniqueFnb.size;
            document.getElementById('statGraded').innerText = `${gradedCount} bài`;
            document.getElementById('statPending').innerText = `${pendingCount} bài`;
            document.getElementById('statsSummary').classList.remove('hidden');
        }

        function initFilters() {
            const industries = [...new Set(allData.map(e => e.khoa))].filter(Boolean).sort();
            document.getElementById('filterIndustry').innerHTML = `<option value="all">Tất cả Ngành hàng</option>` + industries.map(i => `<option value="${i}">${i}</option>`).join('');
            updateFilters('init');
        }

        function updateFilters(source) {
            const selInd = document.getElementById('filterIndustry').value;
            let selDept = document.getElementById('filterDept').value;
            const selSession = document.getElementById('filterSession').value;

            let dataByInd = selInd === 'all' ? allData : allData.filter(e => e.khoa === selInd);

            if (source === 'init' || source === 'industry') {
                const depts = [...new Set(dataByInd.map(e => e.phongBan))].filter(Boolean).sort();
                document.getElementById('filterDept').innerHTML = `<option value="all">Tất cả Mã Lớp / PB</option>` + depts.map(d => `<option value="${d}">${d}</option>`).join('');
                selDept = 'all'; document.getElementById('filterDept').value = 'all';

                const sessions = [...new Set(dataByInd.map(e => e.buoi))].filter(Boolean).sort();
                document.getElementById('filterSession').innerHTML = `<option value="all">Tất cả Buổi</option>` + sessions.map(s => `<option value="${s}">${s}</option>`).join('');
                document.getElementById('filterSession').value = 'all';
            }

            let dataByDept = selDept === 'all' ? dataByInd : dataByInd.filter(e => e.phongBan === selDept);

            if (source === 'init' || source === 'industry' || source === 'dept') {
                const students = [...new Set(dataByDept.map(e => `${e.hoVaTen || 'Ẩn Danh'}|${e.phongBan || 'N/A'}`))].filter(e => e !== "|").sort();
                document.getElementById('filterStudent').innerHTML = `<option value="all">Tất cả Học Viên</option>` + students.map(s => {
                    const parts = s.split('|'); return `<option value="${s}">${parts[0]} (${parts[1]})</option>`;
                }).join('');
            }

            // GOM NHÓM BÀI TẬP (OPTGROUP) ĐỂ DROPDOWN ĐẸP MẮT & KHÔNG LỘN XỘN
            if (source === 'init' || source === 'industry' || source === 'session') {
                const currentSession = document.getElementById('filterSession').value;
                const exSelect = document.getElementById('filterExercise');
                
                if (currentSession === 'all' || selInd === 'all' || typeof CODELAB_DATA === 'undefined' || !CODELAB_DATA[selInd]) {
                    exSelect.innerHTML = `<option value="all">Tất cả Bài tập (Chọn Ngành & Buổi để xem chi tiết)</option>`;
                } else {
                    let htmlOptions = `<option value="all">Tất cả Bài tập trong buổi này</option>`;
                    const sessionData = CODELAB_DATA[selInd].find(s => s.title.includes(currentSession) || currentSession.includes(s.title.split(':')[0]));
                    
                    if (sessionData && sessionData.exercises) {
                        let currentGroup = "Khác";
                        sessionData.exercises.forEach(ex => {
                            if (ex.isGroupHeader) {
                                currentGroup = ex.title;
                                htmlOptions += `<optgroup label="📌 ${currentGroup}">`;
                            } else {
                                htmlOptions += `<option value="${ex.title}">${ex.title}</option>`;
                            }
                        });
                    }
                    exSelect.innerHTML = htmlOptions;
                }
            }
            renderCards();
        }

        const cleanStr = (str) => str ? str.toString().normalize('NFC').toLowerCase().replace(/\s+/g, ' ').trim() : '';

        function getExerciseDetails(exerciseTitle) {
            if (typeof CODELAB_DATA === 'undefined' || !exerciseTitle) return null;
            const targetTitle = cleanStr(exerciseTitle);
            for (let key in CODELAB_DATA) {
                const sessions = CODELAB_DATA[key];
                if (!sessions) continue;
                for (let s of sessions) {
                    if (!s.exercises) continue;
                    for (let ex of s.exercises) {
                        if (ex.title && cleanStr(ex.title) === targetTitle) return ex;
                    }
                }
            }
            return null;
        }

        function getDirectImg(url) { 
            if(!url) return "";
            let m = url.match(/\/d\/(.+?)\//); if(!m) m = url.match(/id=(.+?)(&|$)/); 
            return m ? `https://lh3.googleusercontent.com/d/${m[1]}` : url; 
        }

        let fullscreenImageList = []; let fullscreenImageIndex = 0;
        function openFullscreenModal(urls, idx) { fullscreenImageList = urls; fullscreenImageIndex = idx; updateFullscreenModal(); document.getElementById('fullscreenModal').classList.remove('hidden'); document.getElementById('fullscreenModal').classList.add('flex'); }
        function closeFullscreenModal() { document.getElementById('fullscreenModal').classList.add('hidden'); document.getElementById('fullscreenModal').classList.remove('flex'); }
        function changeFullscreenImg(dir) { if (fullscreenImageList.length === 0) return; fullscreenImageIndex = (fullscreenImageIndex + dir + fullscreenImageList.length) % fullscreenImageList.length; updateFullscreenModal(); }
        function updateFullscreenModal() { const img = document.getElementById('fullscreenModalImg'); const viewRawBtn = document.getElementById('fullscreenModalRawBtn'); const countText = document.getElementById('fullscreenModalCount'); const currentUrl = fullscreenImageList[fullscreenImageIndex]; img.src = getDirectImg(currentUrl); viewRawBtn.href = currentUrl; countText.innerText = `Ảnh ${fullscreenImageIndex + 1} / ${fullscreenImageList.length}`; const prevBtn = document.getElementById('fullscreenModalPrev'); const nextBtn = document.getElementById('fullscreenModalNext'); if (fullscreenImageList.length <= 1) { prevBtn.classList.add('hidden'); nextBtn.classList.add('hidden'); } else { prevBtn.classList.remove('hidden'); nextBtn.classList.remove('hidden'); } }

        function changeSlide(safeKey, dir, total) {
            let current = activeSlides[safeKey] || 0;
            document.getElementById(`slide-${safeKey}-${current}`).classList.add('hidden');
            current = (current + dir + total) % total;
            activeSlides[safeKey] = current;
            document.getElementById(`slide-${safeKey}-${current}`).classList.remove('hidden');
            document.getElementById(`counter-${safeKey}`).innerText = `${current + 1} / ${total}`;
        }

        // HÀM XỬ LÝ "BỎ QUA KHÔNG CHẤM"
        function skipFeedback(key, name, dept, exTitle, session) {
            const fbInput = document.getElementById(`fb-${key}`);
            fbInput.value = "[BỎ QUA] Đã xem. Bài này không cần chấm điểm.";
            saveFeedback(key, name, dept, exTitle, session);
        }

        function renderCards() {
            const selStatus = document.getElementById('filterStatus').value;
            const selInd = document.getElementById('filterIndustry').value;
            const selDept = document.getElementById('filterDept').value;
            const selStudent = document.getElementById('filterStudent').value;
            const selSession = document.getElementById('filterSession').value;
            const selExercise = document.getElementById('filterExercise').value;

            let filtered = allData;
            if (selInd !== 'all') filtered = filtered.filter(e => e.khoa === selInd);
            if (selDept !== 'all') filtered = filtered.filter(e => e.phongBan === selDept);
            if (selSession !== 'all') filtered = filtered.filter(e => e.buoi === selSession);
            if (selExercise !== 'all') filtered = filtered.filter(e => e.tenBaiHoc === selExercise);
            
            let currentStudentName = "Tất cả";
            if (selStudent !== 'all') {
                const parts = selStudent.split('|'); 
                currentStudentName = parts[0];
                filtered = filtered.filter(e => (e.hoVaTen || 'Ẩn Danh') === parts[0] && (e.phongBan || 'N/A') === parts[1]);
            }

            // Lọc ra các bài nộp cuối cùng (mới nhất)
            let mapUnique = {};
            filtered.forEach(e => {
                let key = `${e.hoVaTen || 'Ẩn Danh'}-${e.phongBan || 'N/A'}-${e.tenBaiHoc || 'Unknown'}`;
                if (!mapUnique[key]) mapUnique[key] = e; 
            });
            filtered = Object.values(mapUnique);

            // XỬ LÝ TIẾN ĐỘ CÁ NHÂN (CHỈ HIỂN THỊ KHI CHỌN 1 HỌC VIÊN + 1 NGÀNH + 1 BUỔI)
            const progressPanel = document.getElementById('studentProgressPanel');
            if (selStudent !== 'all' && selInd !== 'all' && selSession !== 'all') {
                const sessionData = CODELAB_DATA[selInd].find(s => s.title.includes(selSession) || selSession.includes(s.title.split(':')[0]));
                if (sessionData && sessionData.exercises) {
                    const allRequiredExercises = sessionData.exercises.filter(ex => !ex.isGroupHeader).map(ex => cleanStr(ex.title));
                    const totalReq = allRequiredExercises.length;
                    
                    const completedTitles = filtered.map(e => cleanStr(e.tenBaiHoc));
                    const doneCount = completedTitles.length;
                    
                    const percent = totalReq === 0 ? 0 : Math.round((doneCount / totalReq) * 100);
                    
                    document.getElementById('progressStudentInfo').innerText = `Học viên: ${currentStudentName} | Lớp: ${selDept} | ${selSession}`;
                    document.getElementById('progressText').innerText = `Đã làm: ${doneCount}/${totalReq} bài`;
                    document.getElementById('progressPercent').innerText = `${percent}%`;
                    document.getElementById('progressBarFill').style.width = `${percent}%`;

                    // Tìm bài thiếu
                    let missingHtml = '';
                    allRequiredExercises.forEach(reqEx => {
                        if (!completedTitles.includes(reqEx)) {
                            // Format lại tên cho đẹp
                            const originalTitle = sessionData.exercises.find(e => cleanStr(e.title) === reqEx).title;
                            missingHtml += `<span class="bg-rose-50 text-rose-600 border border-rose-200 px-2.5 py-1.5 rounded-lg text-[10px] font-bold shadow-sm">${originalTitle}</span>`;
                        }
                    });

                    const missingDiv = document.getElementById('missingExercisesAlert');
                    if (missingHtml !== '') {
                        document.getElementById('missingExercisesList').innerHTML = missingHtml;
                        missingDiv.classList.remove('hidden');
                    } else {
                        missingDiv.classList.add('hidden');
                    }
                    progressPanel.classList.remove('hidden');
                } else {
                    progressPanel.classList.add('hidden');
                }
            } else {
                progressPanel.classList.add('hidden');
            }

            // Lọc theo trạng thái chấm
            if (selStatus === 'pending') filtered = filtered.filter(e => !e.nhanXet || e.nhanXet.toString().trim() === "");
            if (selStatus === 'graded') filtered = filtered.filter(e => e.nhanXet && e.nhanXet.toString().trim() !== "");

            const container = document.getElementById('exercisesContainer');
            if(!container) return; 

            if(filtered.length === 0) { 
                container.innerHTML = `<div class="glass-panel-ultra rounded-3xl p-12 text-center text-slate-400 border border-slate-100"><i class="fas fa-check-circle text-4xl mb-4 text-emerald-500"></i><br>Không có bài làm nào khớp bộ lọc!</div>`; 
                return; 
            }

            container.innerHTML = filtered.map((item, idx) => {
                const safeKey = `card-${idx}`;
                const hasFeedback = item.nhanXet && item.nhanXet.toString().trim() !== "";
                const isSkipped = hasFeedback && item.nhanXet.toString().includes("[BỎ QUA]");

                let statusBadge = "";
                if (isSkipped) {
                    statusBadge = `<span class="bg-slate-100 text-slate-500 border border-slate-300 text-[10px] px-3 py-1.5 rounded-xl font-bold shadow-sm flex items-center gap-1"><i class="fas fa-ban"></i> ĐÃ BỎ QUA</span>`;
                } else if (hasFeedback) {
                    statusBadge = `<span class="bg-emerald-50 text-[#15803d] border border-emerald-200 text-[10px] px-3 py-1.5 rounded-xl font-bold shadow-sm flex items-center gap-1"><i class="fas fa-check-circle"></i> ĐÃ CHẤM</span>`;
                } else {
                    statusBadge = `<span class="bg-rose-50 text-[#b91c1c] border border-rose-200 text-[10px] px-3 py-1.5 rounded-xl font-bold uppercase shadow-sm animate-pulse flex items-center gap-1"><i class="fas fa-exclamation-circle"></i> CHƯA CHẤM</span>`;
                }
                
                let exerciseDetails = getExerciseDetails(item.tenBaiHoc) || {};
                let requirements = exerciseDetails.requirements || [];
                let questions = exerciseDetails.theory || [];

                let requirementsHtml = '';
                if (requirements.length > 0) {
                    requirementsHtml = `
                    <div class="mb-6">
                        <p class="mb-2.5 font-bold text-[11px] text-slate-400 uppercase tracking-widest">Yêu cầu:</p>
                        <ul class="space-y-2 text-xs text-slate-700 pl-4 border-l-4 border-orange-500 bg-orange-50 p-4 rounded-r-2xl shadow-sm leading-relaxed font-medium">
                            ${requirements.map(r => `<li>${r}</li>`).join('')}
                        </ul>
                    </div>`;
                }

                let theoryHtml = '';
                if (questions.length > 0) {
                    if (item.ans1 || item.ans2 || item.ans3 || item.ans4 || item.ans5) {
                        theoryHtml = `<div class="bg-blue-50/50 border border-blue-100 rounded-2xl p-5 h-full flex flex-col justify-start space-y-4 shadow-sm">
                            <span class="text-blue-600 block uppercase text-[11px] font-black tracking-wider"><i class="fas fa-user-edit mr-1.5"></i>Nội dung tự luận</span>
                            <div class="space-y-3">`;
                        for(let i=1; i<=5; i++) {
                            if(item[`ans${i}`]) {
                                let qText = questions[i-1] ? questions[i-1] : `Câu hỏi ${i}`;
                                theoryHtml += `<div class="text-xs text-slate-700 leading-relaxed bg-white/95 p-3.5 rounded-xl border border-blue-100 shadow-sm space-y-1.5">
                                    <p class="font-bold text-slate-800"><i class="fa-solid fa-circle-question text-blue-500 mr-1.5"></i> ${qText}</p>
                                    <p class="pt-2 border-t border-blue-50"><b class="text-emerald-600"><i class="fa-solid fa-comment-dots mr-1.5"></i> Đáp án:</b> <span class="font-medium text-slate-700">${item[`ans${i}`]}</span></p>
                                </div>`;
                            }
                        }
                        theoryHtml += `</div></div>`;
                    } else {
                        theoryHtml = `<div class="bg-rose-50/50 border border-rose-200 border-dashed rounded-2xl p-6 h-full flex flex-col items-center justify-center text-center text-rose-500">
                            <i class="fas fa-edit text-3xl mb-3 text-rose-300"></i>
                            <span class="text-sm font-semibold">Học viên đã bỏ trống phần Trả lời tự luận</span>
                        </div>`;
                    }
                } else {
                    theoryHtml = `<div class="bg-slate-50 border border-slate-200 border-dashed rounded-2xl p-6 h-full flex flex-col items-center justify-center text-center text-slate-400">
                        <i class="fas fa-check-circle text-3xl mb-3 text-emerald-400"></i>
                        <span class="text-sm font-semibold">Bài tập này chỉ yêu cầu nộp Ảnh minh chứng</span>
                    </div>`;
                }

                let imgUrls = (item.linkDrive || "").toString().split(/[\n,]+/).map(u => u.trim()).filter(u => u.startsWith("http"));
                let imgHtml = '';
                
                if (imgUrls.length > 0) {
                    if (imgUrls.length === 1) {
                        imgHtml = `<div class="bg-indigo-50/30 border border-indigo-100/50 rounded-2xl p-5 h-full flex flex-col justify-start space-y-4 shadow-sm">
                            <span class="text-indigo-600 block uppercase text-[11px] font-black tracking-wider"><i class="fas fa-images mr-1.5"></i>Minh chứng hình ảnh</span>
                            <div class="relative w-full aspect-video bg-slate-100 rounded-xl overflow-hidden border border-slate-200 cursor-zoom-in shadow-sm" onclick="openFullscreenModal(${JSON.stringify(imgUrls).replace(/"/g, '&quot;')}, 0)">
                                <img src="${getDirectImg(imgUrls[0])}" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300">
                            </div>
                        </div>`;
                    } else {
                        activeSlides[safeKey] = 0; 
                        let slidesImages = imgUrls.map((url, i) => {
                            let hiddenClass = i === 0 ? "" : "hidden";
                            return `<img id="slide-${safeKey}-${i}" src="${getDirectImg(url)}" class="absolute inset-0 w-full h-full object-contain bg-slate-100 cursor-zoom-in transition-opacity duration-300 ${hiddenClass}" onclick="openFullscreenModal(${JSON.stringify(imgUrls).replace(/"/g, '&quot;')}, activeSlides['${safeKey}'] || 0)">`;
                        }).join('');
                        
                        imgHtml = `<div class="bg-indigo-50/30 border border-indigo-100/50 rounded-2xl p-5 h-full flex flex-col justify-start space-y-4 shadow-sm">
                            <span class="text-indigo-600 block uppercase text-[11px] font-black tracking-wider"><i class="fas fa-images mr-1.5"></i>Minh chứng hình ảnh (${imgUrls.length})</span>
                            <div class="relative w-full aspect-video bg-slate-100 rounded-xl overflow-hidden border border-slate-200 shadow-sm">
                                ${slidesImages}
                                <button type="button" onclick="changeSlide('${safeKey}', -1, ${imgUrls.length})" class="absolute left-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-black/40 hover:bg-black/70 text-white flex items-center justify-center transition-all z-10"><i class="fas fa-chevron-left text-xs"></i></button>
                                <button type="button" onclick="changeSlide('${safeKey}', 1, ${imgUrls.length})" class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-black/40 hover:bg-black/70 text-white flex items-center justify-center transition-all z-10"><i class="fas fa-chevron-right text-xs"></i></button>
                                <span id="counter-${safeKey}" class="absolute bottom-2 right-2 bg-black/60 text-white text-[10px] px-2.5 py-0.5 rounded font-bold backdrop-blur-sm">1 / ${imgUrls.length}</span>
                            </div>
                        </div>`;
                    }
                } else {
                    imgHtml = `<div class="bg-rose-50/30 border border-rose-100/50 rounded-2xl p-5 h-full flex flex-col justify-start space-y-4 shadow-sm">
                        <span class="text-rose-600 block uppercase text-[11px] font-black tracking-wider"><i class="fas fa-images mr-1.5"></i>Minh chứng hình ảnh</span>
                        <div class="bg-white border border-rose-200 border-dashed rounded-xl p-6 h-full flex flex-col items-center justify-center text-center shadow-sm">
                            <div class="w-12 h-12 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center text-xl mb-3"><i class="fas fa-exclamation-triangle"></i></div>
                            <span class="text-sm font-bold text-rose-700 mb-1">CHƯA NỘP ẢNH MINH CHỨNG</span>
                            <span class="text-xs text-rose-500 font-medium">Học viên chưa đính kèm ảnh cho bài tập này.</span>
                        </div>
                    </div>`;
                }

                let safeName = (item.hoVaTen || "").toString().replace(/'/g, "\\'"); 
                let safeDept = (item.phongBan || "").toString().replace(/'/g, "\\'"); 
                let safeEx = (item.tenBaiHoc || "").toString().replace(/'/g, "\\'"); 
                let safeSession = (item.buoi || "").toString().replace(/'/g, "\\'");
                
                // Sử dụng hàm format ngày giờ đẹp
                let displayDate = formatDateTime(item.ngay);

                return `
                <div class="glass-panel-ultra p-6 lg:p-8 rounded-3xl border border-slate-100 shadow-md relative flex flex-col mb-6">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-100 pb-5 mb-5">
                        <div>
                            <h3 class="text-base font-extrabold text-slate-800 tracking-wide">${item.tenBaiHoc || 'Bài tập thực hành'}</h3>
                            <p class="text-xs font-medium text-slate-500 mt-2 flex items-center flex-wrap gap-2">
                                <i class="fas fa-user-circle text-slate-400 text-sm"></i> <span class="text-blue-600 font-bold">${item.hoVaTen || 'Ẩn danh'}</span> 
                                <span class="text-slate-300">|</span>
                                Lớp: <span class="text-slate-700 font-bold">${item.phongBan || "Trống"}</span>
                                <span class="text-slate-300">|</span>
                                <span class="bg-indigo-50 text-indigo-600 border border-indigo-100 px-2 py-0.5 rounded-lg font-bold text-[10px]">${item.khoa || 'Chung'}</span>
                                <span class="text-slate-300">|</span>
                                <i class="far fa-clock text-slate-400"></i> ${displayDate}
                            </p>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            ${statusBadge}
                            <span class="bg-purple-50 text-purple-700 border border-purple-100 text-[10px] px-3 py-1.5 rounded-xl font-bold uppercase shadow-sm">${item.buoi || ''}</span>
                        </div>
                    </div>
                    
                    ${requirementsHtml}
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-5 items-stretch">
                        <div class="h-full">${theoryHtml}</div>
                        <div class="h-full">${imgHtml}</div>
                    </div>
                    
                    <div class="pt-5 border-t border-slate-100">
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2.5"><i class="fas fa-comment-dots text-blue-500 mr-1.5"></i>Ghi Nhận xét của giảng viên</label>
                        <div class="flex flex-col sm:flex-row gap-3">
                            <textarea id="fb-${safeKey}" class="flex-1 min-h-[52px] p-3.5 text-xs bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 outline-none shadow-inner resize-none font-semibold text-slate-800" placeholder="Viết nhận xét chi tiết, khen ngợi hoặc lưu ý điểm cần sửa...">${item.nhanXet || ''}</textarea>
                            <div class="flex flex-col gap-2 shrink-0">
                                <button onclick="saveFeedback('${safeKey}', '${safeName}', '${safeDept}', '${safeEx}', '${safeSession}')" id="btn-${safeKey}" class="px-6 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl shadow-md transition-all flex items-center justify-center gap-2 h-10 w-full"><i class="fas fa-paper-plane"></i> Chốt nhận xét!</button>
                                <button onclick="skipFeedback('${safeKey}', '${safeName}', '${safeDept}', '${safeEx}', '${safeSession}')" class="px-6 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold rounded-xl transition-all flex items-center justify-center gap-2 h-8 w-full"><i class="fas fa-ban"></i> Bỏ qua</button>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function saveFeedback(key, name, dept, exTitle, session) {
            const feedback = document.getElementById(`fb-${key}`).value.trim();
            const btn = document.getElementById(`btn-${key}`);
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Đang lưu...`; btn.disabled = true;

            fetch(API_URL, {
                method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "update_feedback", studentName: name, department: dept, exerciseTitle: exTitle, session: session, feedback: feedback })
            }).then(r=>r.json()).then(res => {
                if(res.status === 'success') {
                    btn.innerHTML = `<i class="fa-solid fa-check"></i> Đã chốt`; btn.classList.replace('bg-blue-600', 'bg-emerald-600');
                    setTimeout(()=> { btn.innerHTML = `<i class="fas fa-paper-plane"></i> Chốt nhận xét!`; btn.classList.replace('bg-emerald-600', 'bg-blue-600'); btn.disabled=false; fetchPracticeData(); }, 1500);
                } else alert("Lỗi lưu nhận xét!");
            }).catch(e => { alert("Lỗi mạng!"); btn.innerHTML = `<i class="fas fa-paper-plane"></i> Chốt nhận xét!`; btn.disabled=false; });
        }
    </script>
</body>
</html>
