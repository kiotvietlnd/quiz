<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành KiotViet - FNB Buổi 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #334155; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        #sidebar { background-color: #1e3a8a; } 
        .group-header { padding: 16px 16px 6px 24px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: #93c5fd; margin-top: 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); margin-right: 12px; }
        .step-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; border-radius: 12px; margin: 0 12px; transition: all 0.2s; }
        .step-inactive { color: #cbd5e1; } .step-inactive:hover { background: rgba(255, 255, 255, 0.1); color: #ffffff; }
        .step-active { background-color: rgba(255, 255, 255, 0.2); color: #ffffff; font-weight: 700; border: 1px solid rgba(255, 255, 255, 0.3); }
        .notification-dot { position: absolute; top: -1px; right: -1px; width: 9px; height: 9px; background-color: #ef4444; border-radius: 50%; border: 2px solid white; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden relative selection:bg-blue-200">

    <!-- HEADER -->
    <header class="bg-white/90 backdrop-blur border-b border-slate-200 h-16 flex items-center justify-between px-4 md:px-6 z-20 shrink-0 sticky top-0">
        <div class="flex items-center gap-4">
            <a href="index.html" class="flex items-center gap-1.5 text-slate-500 hover:text-blue-600 font-bold text-xs border border-slate-200 px-3 py-1.5 rounded-lg hover:bg-blue-50 transition"><i class="fas fa-chevron-left"></i><span class="hidden sm:inline">Quay lại Trang Chủ</span></a>
            <button onclick="toggleSidebar()" class="md:hidden text-slate-500 text-lg"><i class="fas fa-bars"></i></button>
            <div class="h-6 w-px bg-slate-200 hidden lg:block mx-2"></div>
            <div class="font-bold text-sm text-slate-800 hidden lg:block truncate" id="sessionTitle">Đang tải...</div>
        </div>
        <div class="flex items-center gap-3 shrink-0">
            <button onclick="fetchFeedback(true)" class="relative flex items-center gap-2 text-xs font-bold text-amber-700 bg-amber-50 px-3 py-2 rounded-lg transition border border-amber-200 hover:bg-amber-100">
                <i class="fas fa-sync-alt"></i><span id="btnFeedbackText">Tải Nhận Xét</span>
                <span id="globalNotificationDot" class="hidden absolute -top-1 -right-1 flex h-3 w-3"><span class="animate-ping absolute h-full w-full rounded-full bg-red-400 opacity-75"></span><span class="relative rounded-full h-3 w-3 bg-red-500 border-2 border-white"></span></span>
            </button>
            <div class="flex items-center gap-2 text-xs font-bold text-slate-600 bg-slate-100 border border-slate-200 px-3 py-2 rounded-lg"><span id="studentLabel" class="text-blue-600 pr-2">👤 Chưa định danh</span><span id="timeRemaining">Tiến độ: 0%</span></div>
        </div>
    </header>
    <div class="w-full bg-slate-200 h-1 relative z-20"><div id="progressBar" class="bg-blue-600 h-1 transition-all duration-300" style="width: 0%"></div></div>

    <div class="flex flex-1 overflow-hidden">
        <!-- SIDEBAR (Màu xanh đậm chuẩn KiotViet) -->
        <aside id="sidebar" class="w-72 flex flex-col z-30 transition-all shrink-0 shadow-xl relative overflow-hidden hidden md:flex">
            <div class="h-16 flex items-center px-4 border-b border-white/10 justify-between md:hidden">
                <img src="https://logo.kiotviet.vn/KiotViet-Logo-Horizontal-White.svg" class="h-6"><button onclick="toggleSidebar()" class="text-white/50"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-4 border-b border-white/10 shrink-0"><h2 class="text-[10px] font-extrabold text-blue-200 uppercase tracking-widest px-1">Danh sách bài tập</h2></div>
            <div id="sidebarScroll" class="flex-1 overflow-y-auto py-2 custom-scrollbar"><ul id="stepList" class="flex flex-col gap-1"></ul></div>
        </aside>

        <!-- KHUNG LÀM BÀI -->
        <main class="flex-1 overflow-y-auto custom-scrollbar relative p-4 md:p-8 bg-slate-50 flex flex-col">
            <div id="mainContent" class="max-w-4xl mx-auto bg-white border border-slate-200 rounded-3xl shadow-sm p-6 md:p-10 mb-24 w-full relative"></div>
            <div class="fixed bottom-0 right-0 bg-white/90 backdrop-blur border-t border-slate-200 p-4 flex justify-between items-center md:w-[calc(100%-18rem)] w-full z-10">
                <button id="btnPrev" onclick="prevStep()" class="flex items-center gap-2 px-5 py-2 text-sm text-slate-600 font-bold hover:text-blue-600 transition disabled:opacity-40"><i class="fas fa-chevron-left"></i> Trở lại</button>
                <button id="btnNext" onclick="nextStep()" class="flex items-center gap-2 px-6 py-2.5 text-white bg-blue-600 hover:bg-blue-700 rounded-xl transition font-bold text-sm">Tiếp <i class="fas fa-chevron-right"></i></button>
            </div>
        </main>
    </div>

    <!-- CÁC MODAL HỖ TRỢ (Zoom, Chứng nhận...) -->
    <div id="fullscreenModal" class="fixed inset-0 bg-slate-950/95 z-[150] hidden flex-col justify-between items-center p-4 transition-all">
        <div class="w-full flex justify-between items-center px-4 md:px-10 h-16 shrink-0">
            <span id="fullscreenModalCount" class="text-xs font-bold text-slate-400">Ảnh 1 / 1</span>
            <div class="flex items-center gap-3">
                <a id="fullscreenModalRawBtn" href="#" target="_blank" class="px-4 py-2 bg-white/10 hover:bg-white/20 text-white rounded-xl text-xs font-bold transition-all"><i class="fas fa-external-link-alt"></i> Mở tab mới</a>
                <button onclick="closeFullscreenModal()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white/10 hover:bg-red-500/20 text-white hover:text-red-400"><i class="fas fa-times text-lg"></i></button>
            </div>
        </div>
        <div class="relative flex-1 w-full flex items-center justify-center max-h-[calc(100vh-140px)] select-none">
            <button id="fullscreenModalPrev" onclick="changeFullscreenImg(-1)" class="absolute left-4 w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center"><i class="fas fa-chevron-left text-lg"></i></button>
            <img id="fullscreenModalImg" src="" class="max-w-full max-h-full object-contain rounded-lg shadow-2xl">
            <button id="fullscreenModalNext" onclick="changeFullscreenImg(1)" class="absolute right-4 w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center"><i class="fas fa-chevron-right text-lg"></i></button>
        </div>
        <div class="h-8 shrink-0"></div>
    </div>

    <script src="codelab-data.js"></script>
    <script>
        // =======================================================
        // CHÚ Ý CHỖ NÀY KHI BẠN NHÂN BẢN RA CÁC FILE KHÁC NHÉ
        // =======================================================
        const SESSION_ID = 'session_1'; 
        const CURRENT_ROADMAP = "FNB";  // Đổi thành "Retail" nếu là file ngành Retail
        
        // Tự động gen Key lưu trữ độc lập để không dính chùm Data
        const prefix = CURRENT_ROADMAP.toLowerCase();
        const DATA_KEY = `kv_data_${prefix}_b1`; 
        const STORAGE_KEY = `kv_progress_${prefix}_b1`;
        // =======================================================

        let currentStepIndex = 0; let currentExercises = []; let stepDataStore = {}; let pendingFiles = [];

        document.addEventListener('DOMContentLoaded', () => {
            const savedState = localStorage.getItem(STORAGE_KEY); if(savedState) currentStepIndex = parseInt(savedState) || 0;
            const savedData = localStorage.getItem(DATA_KEY); if(savedData) stepDataStore = JSON.parse(savedData);
            const profileRaw = localStorage.getItem('kv_trainer_profile'); 
            if(profileRaw) { const profile = JSON.parse(profileRaw); document.getElementById('studentLabel').innerText = `👤 ${profile.name}`; }

            loadSessionData();

            document.addEventListener('paste', function(e) {
                let items = e.clipboardData.items;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf("image") !== -1) {
                        let file = items[i].getAsFile();
                        let newFile = new File([file], "Anh_Dan_" + Math.floor(Math.random()*1000) + ".png", {type: file.type});
                        pendingFiles.push(newFile); renderFileTags();
                    }
                }
            });

            setTimeout(() => { fetchFeedback(false); }, 1500); 
        });

        function fetchFeedback(isManualClick) {
            const apiUrl = APP_CONFIG.API_URL; if(!apiUrl) return;
            const profileRaw = localStorage.getItem('kv_trainer_profile'); if(!profileRaw) return;
            const profile = JSON.parse(profileRaw); const sessionName = document.getElementById('sessionTitle').innerText;
            if(isManualClick) document.getElementById('btnFeedbackText').innerText = "Đang tải...";
            fetch(`${apiUrl}?studentName=${encodeURIComponent(profile.name)}&session=${encodeURIComponent(sessionName)}`)
            .then(r => r.json()).then(res => {
                if(res.status === 'success' && res.data) {
                    let hasNew = false;
                    for(let i=0; i<currentExercises.length; i++) {
                        const title = currentExercises[i].title;
                        if(res.data[title]) {
                            if(!stepDataStore[i]) stepDataStore[i] = {};
                            if(stepDataStore[i].feedback !== res.data[title]) {
                                stepDataStore[i].feedback = res.data[title]; stepDataStore[i].isUnread = true; hasNew = true;
                            }
                        }
                    }
                    if(hasNew) { localStorage.setItem(DATA_KEY, JSON.stringify(stepDataStore)); renderSidebar(); goToStep(currentStepIndex); }
                    if(isManualClick && !hasNew) alert("Chưa có nhận xét mới nào.");
                }
            }).finally(() => { if(isManualClick) document.getElementById('btnFeedbackText').innerText = "Tải Nhận Xét"; updateGlobalNotification(); });
        }

        // HÀM GỌI ĐÚNG LỘ TRÌNH RETAIL/FNB
        function loadSessionData() {
            if(!CODELAB_DATA[CURRENT_ROADMAP]) return;
            const session = CODELAB_DATA[CURRENT_ROADMAP].find(s => s.id === SESSION_ID); if(!session) return;
            document.getElementById('sessionTitle').innerText = session.title; currentExercises = session.exercises;
            if(currentExercises[currentStepIndex] && currentExercises[currentStepIndex].isGroupHeader) currentStepIndex++;
            renderSidebar(); goToStep(currentStepIndex);
        }

        function updateGlobalNotification() {
            let hasAnyUnread = false; for(let key in stepDataStore) { if(stepDataStore[key].isUnread) { hasAnyUnread = true; break; } }
            const dot = document.getElementById('globalNotificationDot'); if(hasAnyUnread) dot.classList.remove('hidden'); else dot.classList.add('hidden');
        }

        function renderSidebar() {
            const listUl = document.getElementById('stepList'); listUl.innerHTML = ''; let exerciseCounter = 1; 
            currentExercises.forEach((ex, index) => {
                if(ex.isGroupHeader) {
                    const li = document.createElement('li'); li.className = 'group-header'; li.innerText = ex.title; listUl.appendChild(li);
                } else {
                    const li = document.createElement('li'); li.className = `step-item ${index === currentStepIndex ? 'step-active' : 'step-inactive'}`; li.onclick = () => goToStep(index);
                    const isSubmitted = stepDataStore[index] && stepDataStore[index].isSubmitted;
                    let statusIcon = isSubmitted ? `<div class="w-6 h-6 rounded-full bg-emerald-500 text-white flex items-center justify-center text-[10px] font-bold shadow"><i class="fas fa-check"></i></div>` : `<div class="w-6 h-6 rounded-full bg-slate-800 text-amber-400 flex items-center justify-center text-[10px] border border-amber-500/50 shadow-inner"><i class="fas fa-exclamation-triangle"></i></div>`;
                    const hasFeedbackIcon = (stepDataStore[index] && stepDataStore[index].feedback) ? `<span title="Có nhận xét" class="ml-auto text-amber-400 text-sm"><i class="fas fa-comment-dots"></i></span>` : '';
                    const unreadBadge = (stepDataStore[index] && stepDataStore[index].isUnread) ? '<span class="notification-dot"></span>' : '';
                    li.innerHTML = `<div class="relative shrink-0">${statusIcon}${unreadBadge}</div><div class="leading-snug text-[13px] flex-1 flex items-center pr-2 font-medium">${ex.title} ${hasFeedbackIcon}</div>`;
                    listUl.appendChild(li); exerciseCounter++;
                }
            });
            updateGlobalNotification();
        }

        function getDirectImageUrl(url) { let fileIdMatch = url.match(/\/d\/(.+?)\//); if(!fileIdMatch) fileIdMatch = url.match(/id=(.+?)(&|$)/); if(fileIdMatch && fileIdMatch[1]) return `https://lh3.googleusercontent.com/d/${fileIdMatch[1]}`; return url; }

        let fullscreenImageList = []; let fullscreenImageIndex = 0;
        function openFullscreenModal(urls, idx) { fullscreenImageList = urls; fullscreenImageIndex = idx; updateFullscreenModal(); document.getElementById('fullscreenModal').classList.remove('hidden'); document.getElementById('fullscreenModal').classList.add('flex'); }
        function closeFullscreenModal() { document.getElementById('fullscreenModal').classList.add('hidden'); document.getElementById('fullscreenModal').classList.remove('flex'); }
        function changeFullscreenImg(dir) { if (fullscreenImageList.length === 0) return; fullscreenImageIndex = (fullscreenImageIndex + dir + fullscreenImageList.length) % fullscreenImageList.length; updateFullscreenModal(); }
        function updateFullscreenModal() { const img = document.getElementById('fullscreenModalImg'); const viewRawBtn = document.getElementById('fullscreenModalRawBtn'); const countText = document.getElementById('fullscreenModalCount'); const currentUrl = fullscreenImageList[fullscreenImageIndex]; img.src = getDirectImageUrl(currentUrl); viewRawBtn.href = currentUrl; countText.innerText = `Ảnh ${fullscreenImageIndex + 1} / ${fullscreenImageList.length}`; const prevBtn = document.getElementById('fullscreenModalPrev'); const nextBtn = document.getElementById('fullscreenModalNext'); if (fullscreenImageList.length <= 1) { prevBtn.classList.add('hidden'); nextBtn.classList.add('hidden'); } else { prevBtn.classList.remove('hidden'); nextBtn.classList.remove('hidden'); } }

        function goToStep(index) {
            saveDraft(); 
            if(index < 0 || index >= currentExercises.length || currentExercises[index].isGroupHeader) return;
            currentStepIndex = index; const ex = currentExercises[index]; pendingFiles = [];

            document.querySelectorAll('#stepList li').forEach((li, i) => {
                if(!currentExercises[i].isGroupHeader) {
                    if(i === index) { li.classList.add('step-active'); li.classList.remove('step-inactive'); li.scrollIntoView({ behavior: 'smooth', block: 'center' }); } 
                    else { li.classList.add('step-inactive'); li.classList.remove('step-active'); }
                }
            });

            const contentDiv = document.getElementById('mainContent');
            const myData = stepDataStore[index] || { textAnswers: [], uploadedUrls: [], isSubmitted: false };
            if(myData.text && (!myData.textAnswers || myData.textAnswers.length === 0)) myData.textAnswers = [myData.text];

            let html = `<div class="relative w-full pr-12 md:pr-36"><h1 class="text-2xl md:text-3xl font-black text-blue-700 mb-6 pb-4 border-b border-slate-200 tracking-tight">${ex.title}</h1>`;

            if(myData.feedback) {
                const pingHtml = myData.isUnread ? `<span id="pingDot_${index}" class="absolute -top-1 -right-1 flex h-3 w-3"><span class="animate-ping absolute h-full w-full rounded-full bg-red-400 opacity-75"></span><span class="relative rounded-full h-3 w-3 bg-red-500 border border-white"></span></span>` : '';
                html += `<div class="absolute top-0 right-0 z-20"><button onclick="toggleFeedback(${index})" class="relative flex items-center gap-1.5 bg-amber-50 text-amber-700 hover:bg-amber-100 border border-amber-300 px-4 py-2 rounded-xl text-xs font-bold shadow-sm transition"><i class="far fa-comment-dots text-sm"></i><span class="hidden sm:inline">Nhận xét</span>${pingHtml}</button><div id="feedbackBox_${index}" class="hidden absolute top-12 right-0 w-72 md:w-80 bg-white border border-amber-200 shadow-2xl rounded-2xl p-5 z-40 transition origin-top-right"><div class="flex items-center justify-between mb-2.5 pb-2 border-b border-amber-100 font-black text-amber-800 text-xs tracking-wider uppercase"><p><i class="fas fa-chalkboard-teacher"></i> Giảng viên nhận xét:</p><button onclick="toggleFeedback(${index})" class="text-slate-400 hover:text-slate-700"><i class="fas fa-times"></i></button></div><p class="text-slate-700 text-sm whitespace-pre-wrap leading-relaxed">${myData.feedback}</p></div></div>`;
            }
            html += `</div>`;

            if(ex.theory && ex.theory.length > 0) {
                html += `<div class="mb-10"><p class="mb-4 text-blue-600 font-black text-base uppercase tracking-wider flex items-center gap-2"><i class="far fa-file-lines"></i> Phần A: Câu hỏi lý thuyết</p>`;
                let answersArr = myData.textAnswers || [];
                ex.theory.forEach((q, qIndex) => {
                    let ansVal = answersArr[qIndex] || '';
                    html += `<div class="mb-5 bg-slate-50 border border-slate-200 rounded-2xl overflow-hidden shadow-sm"><div class="bg-blue-50/50 p-4 border-b border-slate-200"><p class="text-slate-800 font-bold text-sm leading-relaxed">${q}</p></div><textarea id="inpTextAnswer_${index}_${qIndex}" rows="3" class="w-full p-4 focus:ring-0 outline-none font-medium text-slate-700 text-sm transition-all resize-none bg-white" placeholder="Gõ câu trả lời của bạn..." oninput="saveDraft()">${ansVal}</textarea></div>`;
                });
                html += `</div>`;
            }

            if((ex.requirements && ex.requirements.length > 0) || (ex.instructions && ex.instructions.length > 0)) html += `<p class="mb-4 text-[#166def] font-black text-base uppercase tracking-wider flex items-center gap-2"><i class="fas fa-laptop-code"></i> Bài tập thực hành</p>`;
            if(ex.requirements && ex.requirements.length > 0) html += `<div class="mb-6"><p class="mb-2.5 font-bold text-sm text-slate-500 uppercase tracking-widest">Yêu cầu:</p><ul class="space-y-2 text-sm text-slate-700 pl-4 border-l-4 border-orange-500 bg-orange-50 p-4 rounded-r-2xl">${ex.requirements.map(r => `<li>${r}</li>`).join('')}</ul></div>`;
            if(ex.instructions && ex.instructions.length > 0) html += `<div class="mb-8"><p class="mb-2 font-bold text-sm text-slate-500 uppercase tracking-widest">Hướng dẫn thao tác:</p><div class="bg-slate-50 p-5 rounded-2xl font-mono text-sm text-slate-600 border border-slate-200 leading-relaxed space-y-3">${ex.instructions.map(i => `<p>${i}</p>`).join('')}</div></div>`;

            let uploadWarningHtml = ""; let btnText = "Lưu & Nộp toàn bộ bài này";
            if(myData.isSubmitted && myData.uploadedUrls && myData.uploadedUrls.length > 0) {
                btnText = "Lưu & Nộp bổ sung";
                let thumbnailsHtml = myData.uploadedUrls.map((url, i) => {
                    let directUrl = getDirectImageUrl(url);
                    return `<div class="relative group cursor-zoom-in border border-emerald-300 rounded-xl overflow-hidden aspect-video bg-slate-100" onclick="openFullscreenModal(${JSON.stringify(myData.uploadedUrls).replace(/"/g, '&quot;')}, ${i})"><img src="${directUrl}" class="w-full h-full object-cover opacity-90 group-hover:opacity-50 transition-opacity"><div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"><i class="fas fa-search-plus text-white text-2xl drop-shadow-md"></i></div></div>`;
                }).join('');
                uploadWarningHtml = `<div class="bg-emerald-50 border border-emerald-200 p-5 rounded-2xl mb-6 shadow-sm"><p class="font-black flex items-center gap-1.5 mb-3 text-emerald-700 uppercase tracking-wider"><i class="fas fa-check-circle text-lg"></i> BẠN ĐÃ NỘP BÀI THÀNH CÔNG</p><div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">${thumbnailsHtml}</div></div>`;
            } else {
                uploadWarningHtml = `<div class="bg-red-50 border border-red-200 p-4 rounded-xl mb-4 flex items-start gap-3 shadow-sm"><i class="fas fa-exclamation-circle text-red-500 text-xl mt-0.5 animate-pulse"></i><div><p class="font-black text-red-800 text-sm mb-1">CHƯA NỘP ẢNH MINH CHỨNG</p><p class="text-xs text-red-600 font-medium">Bắt buộc phải tải ảnh lên hệ thống mới tính là hoàn thành bài tập này.</p></div></div>`;
            }

            if(ex.confirm) { html += `<div class="bg-blue-50 border border-blue-200 p-4 rounded-xl mb-4"><p class="text-sm font-bold text-blue-800 flex items-center gap-2"><i class="fas fa-camera"></i> ${ex.confirm}</p></div>`; }

            html += `<div class="mt-8 border-t border-slate-200 pt-8">${uploadWarningHtml}<div id="uploadArea" class="flex flex-col bg-slate-50 p-5 border-2 border-dashed border-slate-300 hover:border-blue-400 rounded-2xl transition-all duration-300 shadow-inner"><div class="flex flex-col md:flex-row items-stretch md:items-center gap-4 w-full"><div class="relative w-full md:w-auto shrink-0"><button class="w-full flex justify-center items-center gap-2 px-4 py-3 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 rounded-xl text-sm font-bold shadow-sm transition"><i class="fas fa-paperclip text-slate-500 text-base"></i> Đính kèm ảnh</button><input type="file" multiple accept="image/*" onchange="handleFileSelect(event)" class="absolute left-0 top-0 w-full h-full opacity-0 cursor-pointer"></div><p class="text-sm text-slate-400 font-medium italic hidden md:block">...hoặc ấn <strong class="text-slate-500 font-bold">Ctrl + V</strong> để dán nhanh.</p><button id="btnSubmitStep_${index}" onclick="uploadToGAS(${index}, '${ex.title}')" class="w-full md:w-auto ml-auto bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl shadow-lg transition font-black text-sm flex items-center justify-center gap-2 shrink-0"><i class="fas fa-cloud-upload-alt"></i> <span id="btnSubmitText_${index}">${btnText}</span></button></div><div id="fileTags" class="mt-4 flex flex-wrap gap-2 empty:hidden"></div></div></div>`;

            contentDiv.innerHTML = html; updateBottomNav(); document.querySelector('main').scrollTo(0, 0); localStorage.setItem(STORAGE_KEY, currentStepIndex);
        }

        function toggleFeedback(index) {
            const box = document.getElementById(`feedbackBox_${index}`);
            if(box.classList.contains('hidden')) {
                box.classList.remove('hidden');
                if(stepDataStore[index] && stepDataStore[index].isUnread) {
                    stepDataStore[index].isUnread = false; localStorage.setItem(DATA_KEY, JSON.stringify(stepDataStore));
                    const pingDot = document.getElementById(`pingDot_${index}`); if(pingDot) pingDot.remove();
                    renderSidebar();
                }
            } else { box.classList.add('hidden'); }
        }

        function handleFileSelect(event) {
            const files = event.target.files; if(files.length === 0) return;
            for(let i=0; i<files.length; i++) { pendingFiles.push(files[i]); }
            renderFileTags(); event.target.value = ''; 
        }

        function renderFileTags() {
            const tagContainer = document.getElementById(`fileTags`); if(!tagContainer) return; let html = '';
            for(let i=0; i<pendingFiles.length; i++) {
                let fileName = pendingFiles[i].name; if(fileName.length > 25) fileName = fileName.substring(0, 20) + '...';
                html += `<span class="bg-blue-100 text-blue-800 border border-blue-200 text-xs font-bold px-3.5 py-1.5 rounded-full flex items-center gap-2 shadow-sm">🖼️ ${fileName} <button onclick="removeFile(${i})" class="ml-1 hover:text-red-500 font-bold ml-2 text-sm focus:outline-none">×</button></span>`;
            } tagContainer.innerHTML = html;
        }

        function removeFile(index) { pendingFiles.splice(index, 1); renderFileTags(); }

        function saveDraft() {
            const index = currentStepIndex; const ex = currentExercises[index];
            if(!stepDataStore[index]) stepDataStore[index] = { textAnswers: [], uploadedUrls: [], isSubmitted: false, feedback: "" };
            if(ex.theory && ex.theory.length > 0) {
                let ansArr = [];
                for(let qIndex = 0; qIndex < ex.theory.length; qIndex++) {
                    const textEl = document.getElementById(`inpTextAnswer_${index}_${qIndex}`);
                    if(textEl) ansArr.push(textEl.value); else ansArr.push("");
                }
                stepDataStore[index].textAnswers = ansArr; localStorage.setItem(DATA_KEY, JSON.stringify(stepDataStore));
            }
        }

        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image(); img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); const MAX_WIDTH = 1200;
                        let width = img.width; let height = img.height;
                        if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
                        canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
                        resolve({ mimeType: 'image/jpeg', base64Data: compressedBase64 });
                    };
                }; reader.onerror = error => reject(error);
            });
        }

        function uploadToGAS(index, exerciseTitle) {
            saveDraft(); const currentData = stepDataStore[index];
            if (pendingFiles.length === 0 && (!currentData.uploadedUrls || currentData.uploadedUrls.length === 0)) { alert("❌ LỖI: Bắt buộc phải tải ảnh lên để nộp bài!"); return; }
            
            const apiUrl = APP_CONFIG.API_URL;
            if (!apiUrl) { alert("Lỗi Admin: Chưa cấu hình API URL!"); return; }
            const profileRaw = localStorage.getItem('kv_trainer_profile'); if (!profileRaw) { window.location.href = 'index.html'; return; }
            const profile = JSON.parse(profileRaw);

            const btnEl = document.getElementById(`btnSubmitStep_${index}`); const txtEl = document.getElementById(`btnSubmitText_${index}`); const oldText = txtEl.innerText;
            btnEl.classList.replace('bg-blue-600', 'bg-slate-400'); btnEl.classList.add('cursor-not-allowed', 'animate-pulse'); txtEl.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Đang tải lên...`; btnEl.disabled = true;

            let promises = []; for(let i = 0; i < pendingFiles.length; i++) { promises.push(compressImage(pendingFiles[i])); }

            Promise.all(promises).then(imagesData => {
                // TRUYỀN LÊN CURRENT_ROADMAP để Google Sheet biết nhánh Retail hay FNB
                const payload = { studentName: profile.name, department: profile.dept, courseName: CURRENT_ROADMAP, session: document.getElementById('sessionTitle').innerText, exerciseTitle: exerciseTitle, textAnswers: currentData.textAnswers || [], images: imagesData };
                return fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
            }).then(r => r.json()).then(data => {
                if(data.status === 'success') {
                    currentData.isSubmitted = true; if(data.urls) currentData.uploadedUrls = [...new Set([...currentData.uploadedUrls, ...data.urls])];
                    localStorage.setItem(DATA_KEY, JSON.stringify(stepDataStore)); pendingFiles = []; alert("🎉 Lưu & Nộp bài thành công!"); goToStep(index); renderSidebar(); 
                } else alert("Lỗi server: " + data.message);
            }).catch(err => alert("Lỗi kết nối mạng: Vui lòng thử lại sau.")).finally(() => { btnEl.classList.replace('bg-slate-400', 'bg-blue-600'); btnEl.classList.remove('cursor-not-allowed', 'animate-pulse'); txtEl.innerHTML = oldText; btnEl.disabled = false; });
        }

        function updateBottomNav() {
            const btnNext = document.getElementById('btnNext');
            let prevIndex = currentStepIndex - 1; while(prevIndex >= 0 && currentExercises[prevIndex].isGroupHeader) prevIndex--;
            document.getElementById('btnPrev').disabled = (prevIndex < 0);
            
            let totalRealExercises = 0; let completedCount = 0;
            for(let i=0; i<currentExercises.length; i++) { if(!currentExercises[i].isGroupHeader) { totalRealExercises++; if(stepDataStore[i] && stepDataStore[i].isSubmitted) completedCount++; } }
            const percent = totalRealExercises === 0 ? 0 : Math.round((completedCount / totalRealExercises) * 100);

            let isLastStep = true; for(let i = currentStepIndex + 1; i < currentExercises.length; i++) { if(!currentExercises[i].isGroupHeader) { isLastStep = false; break; } }
            if(isLastStep) { btnNext.innerHTML = 'Quay về Trang chủ <i class="fas fa-flag-checkered ml-1"></i>'; btnNext.classList.replace('bg-blue-600', 'bg-emerald-600'); btnNext.classList.replace('hover:bg-blue-700', 'hover:bg-emerald-700'); } 
            else { btnNext.innerHTML = 'Tiếp <i class="fas fa-chevron-right ml-1"></i>'; btnNext.classList.replace('bg-emerald-600', 'bg-blue-600'); btnNext.classList.replace('hover:bg-emerald-700', 'hover:bg-blue-700'); }
            document.getElementById('progressBar').style.width = percent + '%'; document.getElementById('timeRemaining').innerText = `Tiến độ: ${percent}%`;
        }

        function nextStep() {
            saveDraft();
            let totalRealExercises = 0; let completedCount = 0;
            for(let i=0; i<currentExercises.length; i++) { if(!currentExercises[i].isGroupHeader) { totalRealExercises++; if(stepDataStore[i] && stepDataStore[i].isSubmitted) completedCount++; } }
            const percent = totalRealExercises === 0 ? 0 : Math.round((completedCount / totalRealExercises) * 100);
            let nextIndex = currentStepIndex + 1; while(nextIndex < currentExercises.length && currentExercises[nextIndex].isGroupHeader) nextIndex++;

            if(nextIndex < currentExercises.length) { goToStep(nextIndex); } 
            else {
                if(percent < 100) { alert(`Bạn mới hoàn thành ${percent}%.\nVui lòng làm đủ các bài chưa có tích Xanh (✅) và nộp ẢNH MINH CHỨNG trước khi Kết thúc.`); } 
                else { window.location.href = 'index.html'; } // Đã đủ 100% thì về Home
            }
        }

        function prevStep() { saveDraft(); let prevIndex = currentStepIndex - 1; while(prevIndex >= 0 && currentExercises[prevIndex].isGroupHeader) prevIndex--; if(prevIndex >= 0) goToStep(prevIndex); }

        function toggleSidebar() { const sidebar = document.getElementById('sidebar'); sidebar.classList.toggle('hidden'); if(window.innerWidth < 768) { sidebar.classList.toggle('absolute'); sidebar.classList.toggle('inset-y-0'); sidebar.classList.toggle('left-0'); } }
    </script>
</body>
